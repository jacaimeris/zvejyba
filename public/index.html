/* ---------- rytojaus išvyka: prognozė, dosjė, greitas įvedimas, spintos įkėlimas ---------- */
const wkey=w=>String((w&&w.name)||'').toLowerCase().replace(/[^a-ząčęėįšųūž]/g,'');
/* prognozė: pirma duomenų bazės įrašas, kitaip šalia puslapio publikuotas forecast.json (LHMT + Open-Meteo) */
const fcMatch=(list,w,date)=>(list||[]).find(f=>f.date===date&&wkey(w).startsWith(String(f.waterId||'~')));
const fcFor=(w,date)=>w?fcMatch(S.forecasts,w,date)||fcMatch(S.fcFile,w,date)||null:null;
function fcLine(){const w=waterById(S.plan.waterId),f=fcFor(w,S.plan.date);
  if(!w)return '<div class="small muted">Pasirink vandenį – jei jam yra prognozė, ji bus įrašyta į brifą automatiškai.</div>';
  if(!f)return '<div class="small muted">Šiai dienai prognozės nėra, įvesk skaičius ranka.</div>';
  return `<div class="small"><span class="pill good">prognozė yra</span> ${esc(f.tMin+'…'+f.tMax+' °C · '+f.windDir+' '+f.windMs+' m/s · '+f.pressure+' · '+f.cloud)}. Tuščius laukus brifas užpildys pats.</div>`}
S.fcFile=[];
fetch('forecast.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.items)){S.fcFile=j.items;S.fcMeta=j;const x=document.getElementById('fcLine');if(x)x.innerHTML=fcLine();if(S.brief)renderLive()}}).catch(()=>{});
const dosFor=w=>w?S.dossiers.find(d=>wkey(w).startsWith(String(d.waterId||'~')))||null:null;
function fcText(p,w){const f=fcFor(w,p.date);if(!f)return '(prognozės šiai dienai bazėje nėra)';
  return `šaltinis ${f.source}; t ${f.tMin}..${f.tMax} °C; debesys ${f.cloud}; vėjas ${f.windDir}, ${f.windMs} m/s, gūsiai ${f.gustMs}; slėgis ${f.pressure}; krituliai ${f.precip}; matomumas ${f.visibility}; saulėtekis ${f.sunrise}, saulėlydis ${f.sunset}; vandens temp. ${f.waterTempEst}. ${f.notes||''}`}
function dosText(w){const d=dosFor(w);if(!d)return '(dosjė nesurinkta)';
  return JSON.stringify({faktai:d.facts,teisė:d.legal,žuvys:d.fish,gyliai:d.bathymetry,vietos:d.spots,vėjoPlanas:d.windPlan,ribos:d.limits})}
function prefillFromFc(p,w){const f=fcFor(w,p.date);if(!f||!f.plan)return;Object.entries(f.plan).forEach(([k,v])=>{if(!p[k])p[k]=v})}
function fcHTML(b){const f=fcFor(b.water,b.p.date);if(!f)return `<div class="panel muted small">Šiai dienai prognozės bazėje nėra. Paprašyk Claude jos atnaujinti.</div>`;
  const cell=(k,v)=>`<div class="pick"><div class="small muted">${k}</div><b>${esc(v)}</b></div>`;
  return `<div class="panel"><h3>Prognozė · ${esc(b.p.date)}</h3><div class="grid2">${cell('Temperatūra',f.tMin+'…'+f.tMax+' °C')}${cell('Vėjas',f.windDir+', '+f.windMs+' m/s')}${cell('Gūsiai',f.gustMs+' m/s')}${cell('Debesuotumas',f.cloud)}${cell('Slėgis',f.pressure)}${cell('Matomumas',f.visibility)}${cell('Saulė',f.sunrise+' – '+f.sunset)}${cell('Vanduo',f.waterTempEst)}</div><div class="small muted" style="margin-top:8px">${esc(f.source)}. ${esc(f.notes||'')}</div></div>`}
function extrasHTML(b){const r=b.rec;if(!r||r.error)return '';

  return blk('Vėjas ir vietos šiandien',esc(r.windPlan||''))+blk('Kaip vesti masalus',(r.retrieves||[]).map(x=>'• '+esc(x)).join('<br>'))+blk('Planas B',esc(r.planB||''))+blk('Claude patarimai',(r.tips||[]).map(x=>'• '+esc(x)).join('<br>'))}
function dosHTML(b){const d=dosFor(b.water);if(!d)return '';const f=d.facts||{},l=d.legal||{};
  return `<details class="fold"><summary>Telkinio dosjė: ${esc(d.name)}</summary><div class="small" style="margin-top:8px">
  <p><b>Faktai.</b> ${f.area_ha} ha, vid. gylis ${f.depthMean_m} m, didž. ${f.depthMax_m} m, krantas ${f.shore_km} km. ${esc(f.shores||'')}. Dugnas: ${esc(f.bottom||'')}. ${esc(f.flow||'')} <span class="muted">(${esc(f.source||'')})</span></p>

function quickBox(){return `<div class="panel list"><label class="f big">Papasakok, kur ir ko žvejosi<textarea id="quickText" rows="3" placeholder="Pvz.: rytoj važiuoju į Viesus ešerių, atsarginė lydeka, iš valties su elektra" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)"></textarea></label>

async function quickGo(btn){

Schema: {"date":"","waterName":"vienas iš: ${names.join(', ')}","type":"${TRIPTYPES.join('|')}","species":["${TARGETS.join('|')}"],"time":"HH:MM","end":"HH:MM"}

    if(o.waterName&&!S.waters.some(w=>w.name===o.waterName)){const k=KB_WATERS.find(x=>x.name===o.waterName);if(k){await save('waters',JSON.parse(JSON.stringify({...k,kbSeed:true})))}}

    if(w)S.plan.waterId=w.id;if(o.date)S.plan.date=o.date;if(TRIPTYPES.includes(o.type))S.plan.type=o.type;

/* ---------- Batimetrija: LEU / ArcGIS "Lietuvos ežerų batimetrija" (bathy.json), ežerų skiltis, vietos brifui ---------- */
const BATHY={lakes:null,err:'',loading:false};
async function loadBathy(){
  if(BATHY.lakes||BATHY.loading)return;BATHY.loading=true;
  try{const r=await fetch('lakes-index.json');if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();BATHY.lakes=j.lakes||[];BATHY.src=j.src||'';
    BATHY.lakes.forEach(l=>{l.cont=[];l.pts=[];l.spots=[]})} // sunkūs laukai kraunami pagal poreikį: lakes/<id>.json
  catch(e){BATHY.err=String(e.message||e)}
  BATHY.loading=false;if(S.tab==='more'&&S.more==='lakes'||S.tab==='trip')renderMain()}
const LAKE_P={};
function loadLake(l){if(!l)return Promise.resolve(null);if(l._ok)return Promise.resolve(l);if(LAKE_P[l.id])return LAKE_P[l.id];
  return LAKE_P[l.id]=fetch('lakes/'+encodeURIComponent(l.id)+'.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(d=>{l.cont=d.cont||[];l.pts=d.pts||[];l.spots=d.spots||[];l._ok=true;l._err='';renderLive();return l})
    .catch(e=>{delete LAKE_P[l.id];l._err=String(e.message||e);return l})}
const bkey=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/\b(ezeras|ez|tv|ezerelis)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
function bathyFor(w){if(!BATHY.lakes||!w)return null;const k=bkey(w.name);if(!k)return null;
  const l=BATHY.lakes.find(l=>l.k===k)||BATHY.lakes.find(l=>l.k&&(k.startsWith(l.k+' ')||l.k.startsWith(k+' ')))||null;
  if(l&&!l._ok&&!l._err)loadLake(l);return l}
const SPCOL={'Lydeka':'#c0392b','Ešerys':'#e08a00','Starkis':'#2e8b57','Žiema':'#34495e'};
function spotsFor(lk,p){if(!lk)return [];
  const want=new Set((p&&p.species||[]).filter(x=>SPCOL[x]));const ice=p&&/žiemin/i.test(p.type||'');
  let s=lk.spots.filter(x=>x.sp==='Žiema'?ice:(!want.size||want.has(x.sp)));
  s=s.filter((x,i,a)=>a.findIndex(y=>y.sp===x.sp&&Math.abs(y.lon-x.lon)<1e-5&&Math.abs(y.lat-x.lat)<1e-5)===i);
  return s.map((x,i)=>({...x,n:i+1}))}
const spotWhy=s=>s.sp==='Žiema'?`giliausia žinoma vieta (${fmt1(s.d)} m)`
  :s.sp==='Lydeka'?`gylio kritimas ties ${fmt1(s.d)} m izobata, krantas ${s.shore} m: pasalos vieta tarp seklumos ir gilesnio vandens`
  :s.sp==='Ešerys'?`${fmt1(s.d)} m kraštas su kritimu (~${s.slope}°): ešerių sekimo juosta prie nuolydžio`
  :`${fmt1(s.d)} m kritimo kraštas (~${s.slope}°): starkio/gilesnė briauna`;
function bathyMapSVG(lk,spots,opt={}){
  if(!lk._ok)return `<div class="small muted panel" style="text-align:center;padding:40px 12px">${lk._err?'Gylių duomenys neužsikrovė: '+esc(lk._err):'Kraunami gyliai…'}</div>`;
  const [x0,y0,x1,y1]=lk.bbox,c=Math.cos((y0+y1)/2*Math.PI/180),W=640,pad=14;
  const sx=(W-2*pad)/((x1-x0)*c||1e-6),sy=sx;const H=Math.round(((y1-y0)*sy)+2*pad);
  const X=lon=>(pad+(lon-x0)*c*sx).toFixed(1),Y=lat=>(pad+(y1-lat)*sy).toFixed(1);
  const md=lk.maxd||1;
  /* Gylis kaip popieriaus sluoksniai: kiekvienas uždaras kontūras užpildomas savo gylio spalva
     (šviesu ties krantu, tamsu gilumoje) ir meta šešėlį ant seklesnio sluoksnio po juo.
     Piešimo tvarka iš kontūrų medžio (bathyRings), kad povandeninės kalvos nepasislėptų. */
  const col=d=>{const t=Math.pow(Math.min(1,Math.abs(d)/md),1.1);return `hsl(${(203+15*t).toFixed(0)} ${(45+40*t).toFixed(0)}% ${(92-72*t).toFixed(0)}%)`};
  const R=bathyRings(lk),uid='bm'+(bathyMapSVG.n=(bathyMapSVG.n||0)+1);
  const P=c=>'M'+c.map(p=>X(p[0])+' '+Y(p[1])).join('L')+'Z';
  const defs=R.order.map((r,i)=>`<path id="${uid}r${i}" d="${P(r.c)}"/>`).join('');
  const layers=R.order.map((r,i)=>`<use href="#${uid}r${i}" transform="translate(.8 2.6)" fill="rgba(6,34,62,.12)"/><use href="#${uid}r${i}" transform="translate(.4 1.2)" fill="rgba(6,34,62,.2)"/><use href="#${uid}r${i}" fill="${col(r.fd)}" stroke="rgba(255,255,255,.65)" stroke-width=".8" stroke-linejoin="round"><title>${fmt1(r.d)} m</title></use>`).join('');
  const glow=R.order.map((r,i)=>r.par?'':`<use href="#${uid}r${i}" fill="#f4efe4" stroke="#f4efe4" stroke-width="10"/>`).join('');
  const lines=R.open.map(r=>`<path d="${'M'+r.c.map(p=>X(p[0])+' '+Y(p[1])).join('L')}" fill="none" stroke="${col(r.d)}" stroke-width="1" stroke-linejoin="round"><title>${fmt1(r.d)} m</title></path>`).join('');
  const paths=`<defs>${defs}<filter id="${uid}f" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter><linearGradient id="${uid}g">${[0,.25,.5,.75,1].map(t=>`<stop offset="${t}" stop-color="${col(t*md)}"/>`).join('')}</linearGradient></defs><g filter="url(#${uid}f)" opacity=".8">${glow}</g>${layers}${lines}`;
  const dots=lk.pts.length<=140?lk.pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="1.8" fill="#16425b" opacity=".55"><title>${p[2]==null?'':fmt1(Math.abs(p[2]))+' m'}</title></circle>`).join(''):'';
  const mk=(spots||[]).map(s=>`<g><circle cx="${X(s.lon)}" cy="${Y(s.lat)}" r="9" fill="${SPCOL[s.sp]}" stroke="#fff" stroke-width="2"/><text x="${X(s.lon)}" y="${(+Y(s.lat)+3.6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${s.n}</text></g>`).join('');
  const my=(opt.mine||[]).map(p=>`<path d="M${X(p.lon)} ${(+Y(p.lat)-7).toFixed(1)}l5 7-5 7-5-7z" fill="#111" stroke="#fff" stroke-width="1.2"><title>${esc(p.t||'laimikis')}</title></path>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lk.name)} gylių žemėlapis" style="width:100%;height:auto;background:#ede3d1;border-radius:10px;display:block">${paths}${dots}${my}${mk}<g font-size="11" fill="#16425b"><rect x="${pad}" y="${H-pad-5}" width="70" height="7" rx="3.5" fill="url(#${uid}g)"/><text x="${pad+76}" y="${H-pad+2}">0–${fmt1(md)} m</text><text x="${W-pad}" y="${H-pad+2}" text-anchor="end">šiaurė ↑</text></g></svg>`}
/* Kontūrų medis vienam ežerui (skaičiuojama kartą): kiekvienas uždaras kontūras gauna mažiausią jį
   gaubiantį kontūrą (tėvą). Jei kontūras seklesnis už tėvą, tai povandeninė kalva: jo vidus seklesnis,
   todėl dažomas ankstesnio (seklesnio) lygio spalva. Atviros linijos (nutrūkę kontūrai) piešiamos tik linija. */
function bathyRings(lk){
  if(lk._rings&&lk._rings.src===lk.cont)return lk._rings;
  const closed=[],open=[];
  lk.cont.forEach(([d,c])=>{const a=c[0],b=c[c.length-1];(c.length>3&&a[0]===b[0]&&a[1]===b[1]?closed:open).push({d:Math.abs(d),c})});
  closed.forEach(r=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of r.c){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}r.bb=[x0,y0,x1,y1];r.area=(x1-x0)*(y1-y0);r.kids=[]});
  const inside=(pt,poly)=>{let o=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])o=!o}return o};
  const bySize=[...closed].sort((a,b)=>a.area-b.area),roots=[];
  bySize.forEach((r,i)=>{let par=null;for(let k=i+1;k<bySize.length;k++){const q=bySize[k];
    if(q.bb[0]<=r.bb[0]&&q.bb[1]<=r.bb[1]&&q.bb[2]>=r.bb[2]&&q.bb[3]>=r.bb[3]&&inside(r.c[0],q.c)){par=q;break}}
    (par?par.kids:roots).push(r);r.par=par});
  const levels=[...new Set(closed.map(r=>r.d))].sort((a,b)=>a-b);
  closed.forEach(r=>{if(r.par&&r.d<r.par.d){const i=levels.indexOf(r.d);r.fd=i>0?levels[i-1]:r.d/2}else r.fd=r.d});
  const order=[],walk=list=>list.sort((a,b)=>b.area-a.area).forEach(r=>{order.push(r);walk(r.kids)});walk(roots);
  return lk._rings={src:lk.cont,order,open}}
function mineOn(w,lk){ // jo paties laimikiai su GPS (iš nuotraukų EXIF)
  const out=[];S.trips.forEach(t=>{if(w&&(t.waterId===w.id||bkey(t.waterName)===bkey(w.name)))(t.catches||[]).forEach(c=>{if(c.lat&&c.lon)out.push({lat:+c.lat,lon:+c.lon,t:`${t.date} ${c.species||''}`})})});return out}

const CRC_T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const u16=n=>new Uint8Array([n&255,(n>>8)&255]),u32=n=>new Uint8Array([n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255]);
  const cat=a=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
  files.forEach(f=>{const nm=enc.encode(f.name),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
    const lh=cat([u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(d.length),u32(d.length),u16(nm.length),u16(0),nm]);
    parts.push(lh,d);
    cd.push(cat([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(d.length),u32(d.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),nm]));
    off+=lh.length+d.length});
  const cdb=cat(cd),end=cat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdb.length),u32(off),u16(0)]);
  return cat([...parts,cdb,end])}
async function exportProject(btn){

  if(!dict)return;
  if(b.dataset.on==='1'){dict.stop();return}
  const ta=$('#freeText');let base=ta.value?ta.value+' ':'';
  dict.onPartial(({text})=>{ta.value=base+text});
  dict.onFinal(({text})=>{base+=text+' ';ta.value=base});
  dict.onState(({state})=>{b.dataset.on=state==='listening'?'1':'';b.textContent=state==='listening'?'Sustabdyti':'Diktuoti'});
  dict.start().catch(()=>toast('Mikrofono leidimas nesuteiktas, rašyk ranka.'));
}

/* ============================================================
   JUDESYS (Kinetics + Anime.js 4). Svoris: atvyksta lėtai, išeina greitai,
   spaudžiama greitai, atšoka spyruokle. Be Anime.js viskas veikia statiškai.
   Fokuso momentai: echolotas, kol renkami masalai; žuvies šuolis, kai įrašomas laimikis.
   ============================================================ */
const Anime=()=>window.anime||null;
const inView=el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.height>0&&r.bottom>0&&r.top<innerHeight};
function onceVisible(el,fn){if(!('IntersectionObserver' in window)){fn(el);return}const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();fn(el)}},{threshold:.15});io.observe(el)}
const Motion={
 /* Stagger Entrance: tik matomi vaikai, kryptimi pagal navigaciją */
 enter(root,dir){const a=Anime();if(!a)return;const t=[];
  [...root.children].forEach(el=>{if(el.matches('.chips')&&el.querySelector('[data-act="who"]'))return; // žmogaus pasirinkimas lieka vietoje
   if(el.matches('.fgrid,.duo,.list:not(.panel)'))t.push(...el.children);else t.push(el)});
  const vis=t.filter(inView).slice(0,12);if(!vis.length)return;
  if(reduceMotion()){a.animate(vis,{opacity:{from:0},duration:180,ease:'outQuad',onComplete:a.utils.cleanInlineStyles});return}
  a.animate(vis,{opacity:{from:0},x:{from:dir*28},y:{from:dir?0:16},duration:dir?460:640,ease:'outExpo',delay:a.stagger(dir?30:45),onComplete:a.utils.cleanInlineStyles})},
 /* Rack Focus: rezultatai išnyra iš gylio ir ryškėja */
 surface(els){const a=Anime();if(!a)return;const vis=[...els].filter(inView).slice(0,10);if(!vis.length)return;
  if(reduceMotion()){a.animate(vis,{opacity:{from:0},duration:200,ease:'outQuad',onComplete:a.utils.cleanInlineStyles});return}
  a.animate(vis,{opacity:{from:0},y:{from:18},filter:['blur(6px)','blur(0px)'],duration:720,ease:'outExpo',delay:a.stagger(70),onComplete:a.utils.cleanInlineStyles})},
 /* Elastic Progress: juostos ir stulpeliai auga, kai pamatomi */
 grow(root){const a=Anime();if(!a||reduceMotion())return;
  const run=el=>{const bars=el.querySelectorAll('.bar-fill'),cols=el.querySelectorAll('.hist i');
   if(bars.length)a.animate(bars,{scaleX:[0,1],duration:900,ease:'outExpo',delay:a.stagger(50),onComplete:a.utils.cleanInlineStyles});
   if(cols.length)a.animate(cols,{scaleY:[0,1],duration:800,ease:'outExpo',delay:a.stagger(25),onComplete:a.utils.cleanInlineStyles})};
  root.querySelectorAll('.bars,.hist').forEach(el=>{if(inView(el)){run(el);return}
   const bars=el.querySelectorAll('.bar-fill'),cols=el.querySelectorAll('.hist i');if(bars.length)a.utils.set(bars,{scaleX:0});if(cols.length)a.utils.set(cols,{scaleY:0});onceVisible(el,run)})},
 /* Odometer Count-up */
 count(root){const a=Anime();if(!a||reduceMotion())return;
  root.querySelectorAll('.tile b').forEach(b=>{const s=b.textContent.trim(),v=parseInt(s,10);if(!(v>1)||String(v)!==s)return;const o={v:0};b.textContent='0';
   a.animate(o,{v,duration:900,ease:'outExpo',onUpdate:()=>{b.textContent=Math.round(o.v)},onComplete:()=>{b.textContent=s}})})},
 tick(el){const a=Anime();if(!a||!el)return;a.animate(el,reduceMotion()?{opacity:{from:.4},duration:300,onComplete:a.utils.cleanInlineStyles}:{opacity:{from:.4},y:{from:-8},duration:450,ease:'outExpo',onComplete:a.utils.cleanInlineStyles})},
 /* Badge Counter: spyruoklinis šuoliukas */
 pop(el,s=1.9){const a=Anime();if(!a||!el||reduceMotion())return;a.utils.remove(el);a.animate(el,{scale:[s,1],ease:a.spring({bounce:.5,duration:500}),onComplete:a.utils.cleanInlineStyles})},
 dart(btn){const a=Anime(),s=btn&&btn.querySelector('svg');if(!a||!s||reduceMotion())return;a.utils.remove(s);
  a.animate(s,{x:[{to:12,duration:140,ease:'outQuad'},{to:0,duration:620,ease:'outExpo'}],onComplete:a.utils.cleanInlineStyles});this.pop(btn,1.08)},
 /* Error Shake: kratomas tik taisytinas laukas */
 shake(el){const a=Anime();if(!el)return;if(!inView(el))el.scrollIntoView({block:'center'});if(el.focus)try{el.focus({preventScroll:true})}catch(e){}if(!a||reduceMotion())return;a.utils.remove(el);
  a.animate(el,{x:[0,-6,6,-5,5,-3,3,0],duration:450,ease:'linear',onComplete:a.utils.cleanInlineStyles})},
 /* Ripple Feedback: plonas vandens ratilas; dėžutė fiksuota, todėl išgyvena perpiešimą */
 ripple(el,e){const a=Anime();if(!a)return;const r=el.getBoundingClientRect();if(!r.width||!r.height)return;const cs=getComputedStyle(el);
  const box=document.createElement('div');box.className='ripbox';box.setAttribute('aria-hidden','true');
  box.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${cs.borderRadius};color:${cs.color}`;
  document.body.appendChild(box);
  if(reduceMotion()){box.style.background='currentColor';a.animate(box,{opacity:[.14,0],duration:300,ease:'outQuad',onComplete:()=>box.remove()});return}
  const kb=!e||!e.detail,x=kb?r.width/2:e.clientX-r.left,y=kb?r.height/2:e.clientY-r.top;
  const d=2*Math.hypot(Math.max(x,r.width-x),Math.max(y,r.height-y));
  const op=el.matches('.btn.primary,.btn.hot,.fcard,.tile-big,.ftile,.xbtn')?.6:.32;
  [[1,0],[.62,100]].forEach(([s,dl])=>{const i=document.createElement('i');i.style.cssText=`left:${x-d/2}px;top:${y-d/2}px;width:${d}px;height:${d}px;opacity:0`;box.appendChild(i);
   a.animate(i,{scale:[.04,s],opacity:[op,0],duration:800,delay:dl,ease:'outExpo'})});
  setTimeout(()=>box.remove(),1000)},
 /* žuvies šuolis iš bangų: x tiesiškai, y balistiškai, pliūpsnis nusileidus */
 leap(species){const a=Anime(),live=document.querySelector('#main .live');if(!a||!live||reduceMotion())return;
  const el=document.createElement('div');el.className='leap';el.setAttribute('aria-hidden','true');el.innerHTML=fishSVG(idOfName(species)||'eserys');live.appendChild(el);
  const W=live.clientWidth,H=live.clientHeight,fw=Math.min(140,W*.38);el.style.width=fw+'px';
  const x0=W*.08,x1=W*.56,peak=H*.06,base=H+8;a.utils.set(el,{x:x0,y:base,rotate:-38});
  a.createTimeline({onComplete:()=>el.remove()})
   .add(el,{x:x1,duration:1000,ease:'linear'},0)
   .add(el,{y:peak,duration:480,ease:'outQuad'},0)
   .add(el,{y:base,duration:520,ease:'inQuad'},480)
   .add(el,{rotate:42,duration:1000,ease:'inOutSine'},0)
   .call(()=>Motion.splash(live,x1+fw*.5,H-22),860)},
 /* saulė išnyra iš vandens ir nukeliauja iki dabartinės vietos; nueita dienos dalis nusipiešia kartu */
 sunrise(svg){const a=Anime();if(!a||!svg||reduceMotion())return;
  const day=svg.querySelector('.sa-day'),past=svg.querySelector('.sa-past'),tws=svg.querySelectorAll('.sa-tw'),sun=svg.querySelector('.sa-sun');
  if(day)a.animate(day,{opacity:{from:0},duration:600,ease:'outQuad',onComplete:a.utils.cleanInlineStyles});
  if(past)a.animate(a.svg.createDrawable(past),{draw:['0 0','0 1'],duration:1400,delay:150,ease:'outExpo'});
  if(tws.length)a.animate(tws,{opacity:{from:0},duration:500,delay:a.stagger(140,{start:450}),ease:'outQuad',onComplete:a.utils.cleanInlineStyles});
  if(sun&&svg.dataset.u!==''){const cx=+svg.dataset.cx,rx=+svg.dataset.rx,ry=+svg.dataset.ry,base=+svg.dataset.base,A=+svg.dataset.a,o={u:-A};
   const place=()=>sun.setAttribute('transform',`translate(${(cx-rx*Math.cos(Math.PI*o.u)).toFixed(1)} ${(base-ry*Math.sin(Math.PI*o.u)).toFixed(1)})`);
   place();a.animate(o,{u:+svg.dataset.u,duration:1400,delay:150,ease:'outExpo',onUpdate:place})}},
 /* vandens "teliuškavimas": bangos šokteli ir nurimsta slopstančia spyruokle */
 slosh(box,peak=1.9){const a=Anime();if(!a||!box||reduceMotion())return;a.utils.remove(box);
  a.animate(box,{'--amp':[peak,1],ease:a.spring({bounce:.6,duration:1500}),onComplete:()=>box.style.removeProperty('--amp')})},
 splash(host,x,y){const a=Anime();if(!a)return;Motion.slosh(host.querySelector('.wavebox'),2.1);[[1.7,0],[1.15,120]].forEach(([s,dl])=>{const r=document.createElement('i');r.className='splash';host.appendChild(r);
  a.utils.set(r,{x:x-40,y:y-10,scale:.2,opacity:0});a.animate(r,{scale:[.2,s],opacity:[.9,0],duration:800,delay:dl,ease:'outExpo',onComplete:()=>r.remove()})})},
 /* langai: atvyksta slysdami, išeina greitai */
 sheetIn(m){const a=Anime();if(!a)return;const sh=m.firstElementChild;
  a.animate(m,{opacity:[0,1],duration:220,ease:'outQuad',onComplete:a.utils.cleanInlineStyles});
  if(sh&&!reduceMotion())a.animate(sh,{y:{from:-36},duration:480,ease:'outExpo',onComplete:a.utils.cleanInlineStyles})},
 sheetOut(m,done){const a=Anime();if(!a){done();return}const sh=m.firstElementChild;
  if(sh&&!reduceMotion())a.animate(sh,{y:-18,duration:180,ease:'inQuad'});
  a.animate(m,{opacity:0,duration:180,ease:'inQuad',onComplete:()=>{m.style.opacity='';done()}})},
 /* Accordion Spring: atsiveriantis turinys */
 unfold(d){const a=Anime();if(!a||!d.open)return;const c=[...d.children].filter(x=>x.tagName!=='SUMMARY');if(!c.length)return;
  a.animate(c,reduceMotion()?{opacity:{from:0},duration:180,onComplete:a.utils.cleanInlineStyles}:{opacity:{from:0},y:{from:-8},duration:340,ease:'outExpo',delay:a.stagger(30),onComplete:a.utils.cleanInlineStyles})},
 /* žuvies / mazgo ekranas: antraštė išnyra, žuvis tolsta slenkant (onScroll) */
 stageIn(st,viaVT){const a=Anime();if(!a)return;const hero=st.querySelector('.fs-hero,.ks-top');if(!hero)return;
  const parts=[...hero.children].filter(x=>!x.hasAttribute('data-hero')&&!x.matches('.xbtn,.bubs'));
  if(parts.length)a.animate(parts,reduceMotion()?{opacity:{from:0},duration:200,onComplete:a.utils.cleanInlineStyles}:{opacity:{from:0},y:{from:16},duration:600,ease:'outExpo',delay:a.stagger(50,{start:100}),onComplete:a.utils.cleanInlineStyles});
  const art=st.querySelector('.fs-art'),sc=st.querySelector('.stage-scroll');if(!art||reduceMotion())return;
  if(!viaVT){const s=art.querySelector('svg');if(s)a.animate(s,{x:{from:-60},opacity:{from:0},duration:800,ease:'outExpo',onComplete:a.utils.cleanInlineStyles})}
  if(sc&&a.onScroll){try{const obs=a.onScroll({container:sc,target:hero,enter:'top top',leave:'top bottom',sync:.4});
   st._par={obs,anim:a.animate(art,{y:['0%','24%'],scale:[1,.86],opacity:[1,.3],ease:'linear',autoplay:obs})}}catch(e){}}},
 stageOut(st){if(st._par){try{st._par.anim.revert();st._par.obs.revert()}catch(e){}st._par=null}if(Motion._ioS){Motion._ioS.disconnect();Motion._ioS=null}},
 /* ciklai sustoja už ekrano */
 loops(root,key){if(!('IntersectionObserver' in window))return;if(Motion[key])Motion[key].disconnect();
  const io=Motion[key]=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('off',!e.isIntersecting)));
  root.querySelectorAll('.fcard,.ftile,.tile-big,.wavebox,.sunarc,.sonar-screen,.fs-hero,.kthumb').forEach(el=>io.observe(el))},
 /* Choice Chips: paspaustas čipas iššoka po perpiešimo */
 popSel(){const p=S._popSel;S._popSel=null;if(!p)return;const el=document.querySelector(`#main [data-act="${p.act}"][data-v="${CSS.escape(p.v||'')}"]`);
  if(el&&el.getAttribute('aria-pressed')==='true')Motion.pop(el,1.12)},
 after(m,anim){Motion.loops(m,'_ioM');if(anim){Motion.grow(m);Motion.sunrise(m.querySelector('.hero-sun .sunarc'));const wb=m.querySelector('.hero .wavebox,.live .wavebox');if(wb)Motion.slosh(wb,1.8)}Motion.popSel();
  const t=document.getElementById('sonarT');if(t){const t0=(S.brief&&S.brief.ts)||Date.now();const iv=setInterval(()=>{if(!t.isConnected){clearInterval(iv);return}t.textContent=Math.round((Date.now()-t0)/1000)+' s'},1000)}
  if(S.tab==='trip'&&S.activeTrip){const A=S.activeTrip,n=(A.catches||[]).length;
   if(S._leap&&S._leap.id===A.id&&n>S._leap.n){Motion.leap((A.catches[n-1]||{}).species);Motion.pop(document.getElementById('catchN'));Motion.surface([...m.querySelectorAll('.item.static')].slice(0,1))}
   S._leap={id:A.id,n}}}
};
/* bendri klausytojai: ratilas ir čipų pažymėjimas (capture, kad suveiktų prieš perpiešimą), sklendžių atsivėrimas */
const RIP='.btn,.chip,.item:not(.static),.ftile,.fcard,.tile-big,.xbtn,nav#tabs button,.seg2 button';
document.addEventListener('click',e=>{const t=e.target;if(!t||!t.closest)return;
  const wb=t.closest('.wavebox');if(wb){Motion.ripple(wb,e);Motion.slosh(wb,1.7)}
  const el=t.closest(RIP);if(el&&!el.disabled){Motion.ripple(el,e);if(el.matches('.chip[data-act]'))S._popSel={act:el.dataset.act,v:el.dataset.v}}
  const s=t.closest('summary');if(s&&s.parentElement&&s.parentElement.tagName==='DETAILS'&&!s.parentElement.open){const d=s.parentElement;requestAnimationFrame(()=>Motion.unfold(d))}},true);
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('paused',document.hidden));
window.addEventListener('resize',placeTab);

/* ---------- boot ---------- */
/* jei duomenys atsiranda per pirmąsias akimirkas, įžanga kartojama nuo pradžių (ji dar vos prasidėjusi), kitaip perpiešiama ramiai */
function reboot(){S._anim=Date.now()-(S._bootT||0)<700;renderTabs();renderMain()}
S._bootT=Date.now();renderAll();
initDb();
setInterval(()=>{refreshHero();const el=$('#elapsed');if(el&&S.activeTrip){const s=elapsedStr(S.activeTrip);if(el.textContent!==s){el.textContent=s;Motion.tick(el)}}},20000);
