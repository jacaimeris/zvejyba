# Netlify publikuoja tik public/. Jokio build žingsnio: lakes-index.json ir lakes/*.json
# sugeneruojami lokaliai (python3 scripts/split_bathy.py) ir įkeliami į git.
[build]
  publish = "public"
  # Praleisk deploy (15 kreditų), jei nepasikeitė nieko, kas keliauja į svetainę:
  # išėjimo kodas 0 = praleisti, 1 = kurti.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify package.json netlify.toml"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# Ežerų duomenys keičiasi retai (kartą per metus): ilgas podėlis + fone atnaujinimas.
[[headers]]
  for = "/lakes/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/lakes-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Orų prognozė: trumpas podėlis.
[[headers]]
  for = "/forecast.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=1800"
