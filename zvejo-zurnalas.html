<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Žvejo žurnalas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Principai: vienas pagrindinis veiksmas ekrane, didelės paspaudimo zonos, detalės sulenktos. */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#15221f; --muted:#68746f; --line:#e3dfd4;
  --accent:#1f5a4a; --accent-ink:#ffffff; --hot:#c4501b; --good:#2e7d52; --warn:#b87a14; --bad:#b23a2a;
  --soft:#ebe8df;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Public Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a18; --surface:#182623; --ink:#e6eeeb; --muted:#8fa39d; --line:#27403b;
  --accent:#5cbf9f; --accent-ink:#08201a; --hot:#ee8a58; --good:#63c28b; --warn:#e2b255; --bad:#ec8472; --soft:#1e312d; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem;letter-spacing:-.01em} h2{font-size:1.4rem} h3{font-size:1.05rem} h4{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
header.top{padding:10px 20px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:640px;margin:0 auto}
header.top h1{font-size:.95rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
header.top small{color:var(--muted);font-size:.75rem}
main{max-width:640px;margin:0 auto;padding:8px 20px 120px;display:flex;flex-direction:column;gap:18px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;max-width:214px;border:0;background:none;padding:14px 4px 13px;font-size:.95rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav#tabs button[aria-current="true"]{color:var(--accent)}
nav#tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.hero{padding-top:14px} .eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.eyebrow::first-letter{text-transform:uppercase}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{color:var(--muted);font-size:.8rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.hot{background:var(--hot);color:#fff;border-color:var(--hot)}
.btn.danger{color:var(--bad)}
.btn.sm{align-self:flex-start;padding:6px 12px;font-size:.88rem;min-height:36px;border-radius:10px}
.btn.big{width:100%;min-height:58px;font-size:1.1rem;border-radius:14px}
.btn.cam{display:flex;align-items:center;justify-content:center;gap:12px;min-height:96px;font-size:1.4rem;font-family:var(--display)}
.btn:disabled{opacity:.5;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;cursor:pointer;font-weight:500;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer;text-align:left;width:100%}
.item.static{cursor:default;padding:10px}
.item:hover:not(.static){border-color:var(--accent)}
.item.more{padding:18px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--accent);font-size:1.2rem}
.thumb.big{width:76px;height:76px}
.badge{background:var(--soft);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{border-radius:999px;padding:1px 9px;font-size:.76rem;font-weight:600;color:#fff;white-space:nowrap}
.pill.good{background:var(--good)} .pill.warn{background:var(--warn)} .pill.bad{background:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-weight:400;color:var(--ink);width:100%;min-width:0;min-height:44px}
label.f.big{font-size:.9rem} label.f.big select{font-size:1.1rem;min-height:54px;font-family:var(--display);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sect{font-family:var(--display);font-weight:700;font-size:1rem;margin:6px 0 2px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,15,12,.5);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:0}
#modal[hidden]{display:none}
.sheet{background:var(--bg);border-radius:0 0 18px 18px;width:100%;max-width:640px;margin:0 auto auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:14px}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:2px 0 8px;z-index:2}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.92rem;max-width:90%;display:none}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:.88rem}
.bar-track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:4px}
.hist{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:8px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.65rem;color:var(--muted);gap:2px}
.hist i{display:block;width:100%;background:var(--hot);border-radius:3px 3px 0 0;min-height:2px}
.prose{white-space:pre-wrap;line-height:1.6}
.prose h4{margin:12px 0 4px}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.78rem}
.scroll-x{overflow-x:auto}
.step{display:flex;gap:10px;margin:4px 0}
.step b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.78rem}
.banner{background:var(--soft);border-left:4px solid var(--warn);padding:12px 14px;border-radius:8px;font-size:.9rem}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.catchrow{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.src{display:inline-block;border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:700;cursor:pointer;margin-right:4px;color:var(--ink)}
.src.g-A{border-color:var(--good)} .src.g-Am{border-color:var(--accent)} .src.g-B,.src.g-Bm{border-color:var(--warn)} .src.g-C,.src.g-D{border-color:var(--bad)}
.lrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.lrow .pill{flex:none;margin-top:2px}
.thumbs{display:flex;gap:4px;margin:8px 0 0;overflow:hidden}
.thumbs img{width:40px;height:40px;border-radius:8px;object-fit:cover}
a{color:var(--accent)}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400;font-size:1.2rem}
details[open]>summary::after{content:"–"}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
details.hyp{padding:8px 14px}
.verdict{border-radius:16px;padding:18px;border:1px solid var(--line);background:var(--surface);border-left-width:6px;display:flex;flex-direction:column;gap:6px}
.verdict.good{border-left-color:var(--good)} .verdict.warn{border-left-color:var(--warn)} .verdict.bad{border-left-color:var(--bad)}
.verdict .vt{font-family:var(--display);font-size:1.35rem;font-weight:700}
.verdict .vl{font-size:.92rem;padding-top:4px}
.verdict details{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.pick{padding:10px 0;border-bottom:1px solid var(--line)} .pick:last-child{border-bottom:0}
.live{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:22px}
.live .muted{color:inherit;opacity:.8}
.live h1{font-size:1.6rem} .live .eyebrow{color:inherit;opacity:.8}
.elapsed{font-family:var(--display);font-size:3.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
@media (prefers-reduced-motion:no-preference){.item,.btn,.chip{transition:border-color .15s,background .15s}}

/* ===== judesys ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tailw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes finw{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes bubup{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-190px);opacity:0}}
@keyframes drawl{to{stroke-dashoffset:0}}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes wavemove{to{transform:translateX(-50%)}}
@keyframes sheen{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes fadeswap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#main.enter>*:nth-child(2){animation-delay:.05s} #main.enter>*:nth-child(3){animation-delay:.1s} #main.enter>*:nth-child(4){animation-delay:.15s} #main.enter>*:nth-child(5){animation-delay:.2s} #main.enter>*:nth-child(n+6){animation-delay:.25s}
.btn:active,.chip:active,.item:active,.fcard:active,.ftile:active,.tile-big:active{transform:scale(.975)}
.fish .fa-body{animation:bob 4.2s ease-in-out infinite}
.fish .fa-tail{transform-box:fill-box;transform-origin:100% 50%;animation:tailw 1.4s ease-in-out infinite alternate}
.fish .fa-fin{transform-box:fill-box;transform-origin:50% 0;animation:finw 2s ease-in-out infinite alternate}
.fish.big .fa-tail{animation-duration:1.1s}
.wavebox{overflow:hidden;height:34px;margin:10px -20px 0;position:relative}
.waves{width:200%;height:100%;display:block;animation:wavemove 14s linear infinite}
.waves .w1{fill:var(--accent);opacity:.18} .waves .w2{fill:var(--accent);opacity:.3;transform:translateX(-12%)}
.wavebox.inlive{position:absolute;left:0;right:0;bottom:0;margin:0;height:46px;opacity:.55}
.wavebox.inlive .waves .w1,.wavebox.inlive .waves .w2{fill:#fff}
.live{position:relative;overflow:hidden}
.live>*{position:relative}.live>.wavebox{position:absolute}
.noscroll{overflow:hidden}
/* žuvų galerija */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fcard{position:relative;overflow:hidden;border:0;border-radius:20px;padding:12px 12px 14px;text-align:left;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));cursor:pointer;display:flex;flex-direction:column;min-height:150px;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
.fcard.wide{grid-column:1/-1;min-height:190px}
.fgrid .fcard:nth-child(2){animation-delay:.06s}.fgrid .fcard:nth-child(3){animation-delay:.12s}.fgrid .fcard:nth-child(4){animation-delay:.18s}.fgrid .fcard:nth-child(5){animation-delay:.24s}.fgrid .fcard:nth-child(6){animation-delay:.3s}.fgrid .fcard:nth-child(7){animation-delay:.36s}
.fcard .fart{flex:1;display:grid;align-items:center}
.fcard .fart svg{width:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.fcard:hover .fish .fa-tail{animation-duration:.6s}
.fmeta{display:flex;flex-direction:column}.fmeta b{font-family:var(--display);font-size:1.15rem}.fmeta span{font-size:.78rem;opacity:.8;font-style:italic}
.fbadge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);border-radius:999px;padding:2px 10px;font-size:.74rem;font-weight:600}
.fthumb{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85)}
.shine{position:absolute;inset:0;pointer-events:none;overflow:hidden}.shine::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-120%)}
.fcard:hover .shine::after{animation:sheen 1s ease}
/* žuvies ekranas */
#stage{position:fixed;inset:0;z-index:25;background:var(--bg);opacity:0;transform:translateY(22px) scale(.985);transition:opacity .26s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
#stage.open{opacity:1;transform:none}
#stage[hidden]{display:none}
.stage-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fstage,.kstage{max-width:640px;margin:0 auto;min-height:100%}
.fs-hero{position:relative;color:#fff;padding:64px 20px 26px;background:linear-gradient(170deg,var(--a),var(--b));border-radius:0 0 32px 32px;overflow:hidden}
.fs-art{position:relative;z-index:1}.fs-art svg{width:100%;filter:drop-shadow(0 14px 14px rgba(0,0,0,.4))}
.fs-hero h1{margin-top:10px;font-size:2.4rem}.fs-hero .lat{font-style:italic;opacity:.8;margin-top:2px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip-lite{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
.chip-lite.warn{background:var(--soft);color:var(--muted)}
.chips2.dark .chip-lite{background:var(--soft);color:var(--ink)}
.xbtn{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.28);color:#fff;font-size:1.6rem;line-height:1;cursor:pointer;backdrop-filter:blur(6px)}
.xbtn.dark{background:var(--soft);color:var(--ink)}
.bubs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bub{position:absolute;bottom:-10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);animation:bubup 4.5s ease-in infinite}
.fs-body{padding:20px 20px 60px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.sec h3{font-size:1.15rem;margin-bottom:8px}.sec h4{font-size:.9rem;color:var(--muted)}.sec p{margin:0;line-height:1.6}
.rv{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.seg2{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;border-radius:10px;padding:8px 2px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.swap{animation:fadeswap .35s ease both}
.thumbs.big img{width:64px;height:64px;border-radius:12px}
/* Ko ieškai */
.ftiles{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;margin:0 -2px}
.ftile{flex:none;width:112px;scroll-snap-align:start;border:2px solid transparent;border-radius:16px;padding:8px 6px 8px;background:linear-gradient(160deg,var(--a),var(--b));color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.55;transition:opacity .2s,transform .2s,border-color .2s}
.ftile svg{width:100%}.ftile span{font-size:.8rem;font-weight:600}
.ftile[aria-pressed="true"]{opacity:1;border-color:var(--hot);transform:translateY(-2px)}
.mini{display:flex;flex:none}.mini svg{width:54px;margin-right:-14px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.summary{align-items:center}
.chip-lite{display:inline-block}
/* Daugiau */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile-big{border:0;border-radius:20px;padding:14px;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:150px;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
.tile-big.knots{background:linear-gradient(160deg,#1f5a4a,#3d8a73)}
.tile-big .tart{flex:1;display:grid;align-items:center}.tile-big .tart svg{width:100%}
.tile-big b{font-family:var(--display);font-size:1.15rem}.tile-big span{font-size:.8rem;opacity:.85}
.kscene.still .kl{animation:none;stroke-dashoffset:0}.kscene.still text{display:none}
.kscene.still .kl{stroke:#fff}.tile-big .kscene .kh{stroke:rgba(255,255,255,.7)}
/* mazgai */
.kcard{animation:rise .5s both;animation-delay:var(--d,0s);align-items:center}
.kthumb{width:110px;flex:none;background:var(--soft);border-radius:12px;padding:4px}.kthumb svg{width:100%;display:block}
.ks-top{position:relative;padding:60px 20px 8px}.ks-top h1{font-size:2rem}
.kstageBox{margin:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 10px 14px;position:relative;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.kscene{width:100%;display:block}
.kl{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl .9s cubic-bezier(.4,0,.2,1) forwards}
.kh{animation:popin .4s ease both}.kl2{animation:popin .4s .5s ease both;transform-box:fill-box;transform-origin:center}
.klab{font-size:14px;fill:var(--muted);font-weight:600;font-family:var(--body);animation:fadeswap .5s ease both}
.kprog{display:flex;gap:8px;justify-content:center;margin-top:6px}
.kdot{width:28px;height:8px;border-radius:6px;border:0;background:var(--line);cursor:pointer;padding:0;transition:background .3s,width .3s}
.kdot.done{background:var(--accent);opacity:.5}.kdot.on{background:var(--hot);width:44px}
.kcap{margin:6px 20px;display:flex;gap:14px;align-items:flex-start;animation:fadeswap .45s ease both}
.knum{font-family:var(--display);font-size:2.6rem;font-weight:700;color:var(--hot);line-height:1}.knum span{font-size:1rem;color:var(--muted);font-weight:500}
.kcap p{margin:2px 0 0;font-size:1.1rem;line-height:1.5}
.kctl{margin:14px 20px 40px}.kctl .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.kl{stroke-dashoffset:0}}
@media (min-width:700px){.fgrid{grid-template-columns:1fr 1fr 1fr}.fcard.wide{grid-column:span 2}}
</style>

/* ============ GRYNA LOGIKA (testuojama be naršyklės) ============ */
const toMin=t=>{if(!t||!/^\d{1,2}:\d{2}/.test(t))return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const DEF_LL={lat:54.69,lon:25.28}; // Vilnius, kai vandens koordinatės nežinomos

function tzOffsetMin(ds){ // Europe/Vilnius poslinkis nuo UTC tą dieną
  try{const h=+new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Vilnius',hour:'2-digit',hour12:false}).format(new Date(ds+'T12:00:00Z'));return ((h%24)-12)*60}catch(e){return 120}}
function sunTimes(ds,lat,lon){ // NOAA apytikslis metodas. Grąžina minutes vietiniu laiku.
  const d=new Date(ds+'T12:00:00Z');const y0=Date.UTC(d.getUTCFullYear(),0,0);const doy=Math.round((d-y0)/864e5);
  const g=2*Math.PI/365*(doy-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const la=lat*Math.PI/180;const c=(Math.cos(90.833*Math.PI/180)/(Math.cos(la)*Math.cos(dec)))-Math.tan(la)*Math.tan(dec);
  if(c>1||c<-1)return null;const ha=Math.acos(c)*180/Math.PI;
  const off=tzOffsetMin(ds);
  return {rise:720-4*(lon+ha)-eq+off,set:720-4*(lon-ha)-eq+off}}
function llFrom(coords){const m=String(coords||'').match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);return m?{lat:+m[1],lon:+m[2]}:DEF_LL}
/* prieblandos langai: 60 min prieš ir po saulėtekio / saulėlydžio (mano operacinis apibrėžimas) */
const TW=60;
function twilightWindows(ds,ll){const s=sunTimes(ds,ll.lat,ll.lon);if(!s)return [];return [[s.rise-TW,s.rise+TW],[s.set-TW,s.set+TW]]}
function overlap(a0,a1,b0,b1){return Math.max(0,Math.min(a1,b1)-Math.max(a0,b0))}
function tripSpan(t){const a=toMin(t.start),b0=toMin(t.end);if(a==null||b0==null)return null;let b=b0;if(b<a)b+=1440;return [a,b]}
function twilightMinutes(t,ll){const sp=tripSpan(t);if(!sp||!t.date)return null;let tw=0;
  for(const off of [0,1440]){const w=twilightWindows(t.date,ll).map(([x,y])=>[x+off,y+off]);w.forEach(([x,y])=>tw+=overlap(sp[0],sp[1],x,y))}
  return {tw,total:sp[1]-sp[0]}}
function inTwilight(ds,min,ll){return twilightWindows(ds,ll).some(([x,y])=>min>=x&&min<=y)}

function moonAge(ds){const d=new Date(ds+'T12:00:00Z');const syn=29.530588853;let a=((d-Date.UTC(2000,0,6,18,14))/864e5)%syn;if(a<0)a+=syn;return a}
function moonNewFull(ds,tol=2){const a=moonAge(ds),syn=29.530588853;const dn=Math.min(a,syn-a),df=Math.abs(a-syn/2);return Math.min(dn,df)<=tol}

function parseExif(buf){

    while(p<v.byteLength-4){const m=v.getUint16(p);if(m===0xFFE1){const len=v.getUint16(p+2);const s=p+4;
        if(v.getUint32(s)!==0x45786966)return {};const t=s+6;const le=v.getUint16(t)===0x4949;const g16=o=>v.getUint16(o,le),g32=o=>v.getUint32(o,le);
        const ifd0=t+g32(t+4);const out={};
        const readIfd=(off,cb)=>{const n=g16(off);for(let i=0;i<n;i++){const e=off+2+i*12;cb(g16(e),g16(e+2),g32(e+4),e+8)}};
        const str=(type,cnt,vo)=>{const o=cnt>4?t+g32(vo):vo;let r='';for(let i=0;i<cnt-1;i++)r+=String.fromCharCode(v.getUint8(o+i));return r};
        const rat=(o)=>g32(o)/(g32(o+4)||1);
        let exifOff=null,gpsOff=null;
        readIfd(ifd0,(tag,ty,cnt,vo)=>{if(tag===0x8769)exifOff=g32(vo);if(tag===0x8825)gpsOff=g32(vo);if(tag===0x0132&&!out.dt)out.dt=str(ty,cnt,vo)});
        if(exifOff!=null)readIfd(t+exifOff,(tag,ty,cnt,vo)=>{if(tag===0x9003)out.dt=str(ty,cnt,vo)});
        if(gpsOff!=null){const gp={};readIfd(t+gpsOff,(tag,ty,cnt,vo)=>{if(tag===1||tag===3)gp[tag]=String.fromCharCode(v.getUint8(vo));
          if(tag===2||tag===4){const o=t+g32(vo);gp[tag]=rat(o)+rat(o+8)/60+rat(o+16)/3600}});
          if(gp[2]!=null&&gp[4]!=null){out.lat=(gp[1]==='S'?-1:1)*gp[2];out.lon=(gp[3]==='W'?-1:1)*gp[4]}}
        if(out.dt){const m2=out.dt.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);if(m2){out.date=`${m2[1]}-${m2[2]}-${m2[3]}`;out.time=`${m2[4]}:${m2[5]}`}}
        return out}
      if((m&0xFF00)!==0xFF00)break;p+=2+v.getUint16(p+2)}
  }catch(e){}
  return {}}

const dInRange=(ds,[m1,d1,m2,d2])=>{const m=+ds.slice(5,7),d=+ds.slice(8,10),x=m*100+d,a=m1*100+d1,b=m2*100+d2;return a<=b?(x>=a&&x<=b):(x>=a||x<=b)};
const normName=s=>String(s||'').toLowerCase().replace(/\b(ežeras|ež\.|upė|tvenkinys|kūdra)\b/g,'').replace(/[^\p{L}\d]+/gu,' ').trim();
function legal(w,type,ds,species){
  const out=[];const L=(lvl,text,src,ver)=>out.push({lvl,text,src,ver:ver||'antrinis'});
  const lg=(w&&w.legal)||{};const isIce=/žiemin/i.test(type||'');const isBoat=/valt|trol/i.test(type||'');
  const kind=(w&&w.kind)||'';const nm=normName(w&&w.name);
  if(!w){L('warn','Vandens telkinys nepasirinktas, teisinė suvestinė negalima.','');return out}
  /* 1. bilietas / leidimas */
  const st=lg.status||'nežinoma';
  if(st==='uždraustas')L('stop','Šiame telkinyje mėgėjų žvejyba uždrausta.',lg.src||'A5');
  else if(st==='neišnuomotas')L('ok','Valstybinis neišnuomotas telkinys: pakanka žvejo mėgėjo bilieto (L05.1). Metinis bilietas tinka. '+(lg.ticket&&!/L05\.1/.test(lg.ticket)?lg.ticket:''),'A3');
  else if(st==='išnuomotas')L('stop','Išnuomotas telkinys: metinio bilieto NEPAKANKA, reikia nuomininko leidimo'+(lg.tenant?' ('+lg.tenant+')':'')+'. Leidimą pirk iš nuomininko arba ALIS.','A3');
  else if(st==='limituota')L('stop','Limituota žvejyba: reikia žvejo mėgėjo kortelės (ir bilieto sąlygų pagal telkinio limitą).','A3');
  else if(st==='ekologinis')L('ok','Ekologinės būklės gerinimo telkinys: plėšrūnams galioja speciali tvarka (žemiau). Bilieto reikalavimas pagal A5 skiriasi tik karpinėms žuvims.','A5');
  else L('warn','Telkinio statusas nežinomas. Prieš išvykstant ALIS sistemoje patikrink, ar jis išnuomotas ar limituotas.','A3');
  if(lg.checked){const age=(new Date(ds)-new Date(lg.checked))/864e5;
    if(age>30)L('warn','Statusas paskutinį kartą tikrintas '+lg.checked+' (prieš '+Math.round(age)+' d.). Nuoma gali būti pasikeitusi, patikrink ALIS.','');
    else L('info','Statusas tikrintas '+lg.checked+' šaltinyje '+(lg.src||'?')+(lg.verifiedPrimary?'.':'. Pirminis teisės aktas NEPERSKAITYTAS.'),lg.src||'')}
  if(lg.todo)L('warn','Neišspręsta: '+lg.todo,'');
  /* 2. ekologinis sąrašas ir draudžiami vandenys */
  const eco=Object.keys(ECO_WATERS).find(k=>normName(k)===nm);
  if(eco&&kind!=='Upė'){L('info',ECO_RULES,'A5');if(ECO_WATERS[eco])L('warn',ECO_WATERS[eco],'A5')}
  /* 3. sezoniniai upių draudimai */
  if(kind==='Upė'){
    if(dInRange(ds,[10,1,12,31])){
      const hit=RIVER_BAN_OCT_DEC.find(r=>normName(r)===nm||nm.startsWith(normName(r)+' '));
      if(hit)L('stop','Ši upė ('+hit+') yra sąraše, kuriame mėgėjų žvejyba uždrausta spalio 1 d. - gruodžio 31 d.','A5');
      else L('warn','Spalio 1 d. - gruodžio 31 d. daugelyje upių žvejyba uždrausta. Šios upės mano dalinis sąrašas neįvardija, bet pilną sąrašą (A5) reikia patikrinti.','A5')}
    if(/nemun/.test(nm)&&dInRange(ds,[7,1,12,1]))L('warn',NEMUNAS_BAN_JUL_DEC,'A5');
  }
  /* 4. rūšys */
  (species||[]).forEach(sp=>{const r=SPECIES_RULES[sp];if(!r)return;
    const closed=r.closed.some(x=>dInRange(ds,x));
    if(closed)L('stop',sp+': šiuo laikotarpiu žvejoti draudžiama (nerštas / draudimo laikotarpis). Pagautą paleisk.',r.src);
    const bits=[];if(r.min)bits.push('mažiausias dydis '+r.min+' cm');if(r.max)bits.push('didžiausias '+r.max+' cm (nesuvartoti didesnių)');if(r.limit)bits.push('iki '+r.limit+' vnt. per dieną');
    if(bits.length&&!closed)L('info',sp+': '+bits.join(', ')+'. '+(r.note||''),r.src);
    else if(!bits.length&&!closed&&r.note)L('info',sp+': '+r.note,r.src);
    if(sp==='Lydeka'&&!closed&&kind==='Upė')L('warn','Lydekos dydžio ribojimas netaikomas 2 priede nurodytose upėse. Ar ši upė ten įrašyta, nepatikrinta (priedas neperskaitytas).','A1')});
  /* 5. įrankiai ir būdai */
  L('info','Vienu metu iki 4 meškerių (įrankių), iš jų ne daugiau kaip 2 su žuvele kaip masalu; iš valties žvejojant judant ne daugiau kaip 2 meškerės (inkaru sustojus galioja bendros sąlygos). Kabliukų iš viso iki 6; dvišakis ir trišakis skaičiuojamas kaip 1.','A2');
  L('info','Draudžiamos gumos ilgesnės nei 40 cm, nepritvirtinti plūdriniai įrankiai (popkės), išskyrus žvejybą nuo ledo.','A2');
  L('info','Būti prie vandens (arčiau nei 25 m) su žvejybos įrankiais be teisės žvejoti draudžiama.','A2');
  L('info',WEIGHT_RULE,'A1');L('info',YEAR_BAN,'A1');
  if(dInRange(ds,[1,2,4,30]))L('warn','Nuo sausio 2 d. iki balandžio 30 d. draudžiama žvejoti naudojant žuvelę kaip masalą (išskyrus žuvies gabalėlį). Tai liečia ir ledo žvejybą su gyvu ar negyvu žuvele.','A2');
  if(isIce){L('warn','Ant ledo privaloma turėti du lanksčia jungtimi sujungtus smaigus lengvai pasiekiamoje vietoje. Draudžiama eiti ant ledo, kai LHMT paskelbė ledo pavojų.','A4');
    L('info','AAD: ledas žmogui saugus nuo 7 cm, grupei nuo 12 cm. Tai minimumai, o ne rekomenduojama riba.','A4')}
  if(isBoat&&lg.boat)L('warn','Valtis/variklis: '+lg.boat,lg.src||'');
  return out}

/* ---- Sąlygų vertinimas pagal EVID ---- */
function condEval(p,w){
  const ds=p.date,ll=llFrom(w&&w.coords);const out=[];const E=id=>EVID.find(e=>e.id===id);
  const A=(ev,state,txt)=>out.push({ev,state,txt});
  const sp=tripSpan({date:ds,start:p.time,end:p.end||p.time});
  const targets=p.species||[];const pike=!targets.length||targets.includes('Lydeka'),zander=targets.includes('Starkis');
  const ice=/žiemin/i.test(p.type||'');
  if(ds&&p.time){const tw=twilightMinutes({date:ds,start:p.time,end:p.end||fromMin(toMin(p.time)+240)},ll);
    const s=sunTimes(ds,ll.lat,ll.lon);
    const sunTxt=s?` Saulėtekis ${fromMin(s.rise)}, saulėlydis ${fromMin(s.set)}.`:'';
    if(tw){const share=Math.round(tw.tw/tw.total*100);
      if(pike)A('EV1',share>=30?'+':share>0?'0':'-',`Prieblandoje praleisi ${tw.tw} min iš ${tw.total} (${share}%).${sunTxt}`);
      if(zander)A('EV7',share>=30?'+':share>0?'0':'-',`Prieblandoje praleisi ${tw.tw} min iš ${tw.total} (${share}%).${sunTxt}`)}}
  if(ds){const mn=moonNewFull(ds,2);if(pike)A('EV3',mn?'+':'0',mn?'Data patenka į ±2 d. nuo jaunaties ar pilnaties.':'Data ne šalia jaunaties ar pilnaties.')}
  const wind=num(p.wind);if(pike&&wind!=null)A('EV2','info',`Vėjas ${fmt1(wind)} m/s. Šaltinis tvirtina, kad stipresnis vėjas = geresni pagavimai, bet slenksčio nenurodo. Palyginsiu su tavo duomenimis, kai jų bus.`);
  const wt=num(p.wtemp);if(pike&&wt!=null&&!ice)A('EV4','info',`Vandens temperatūra ${fmt1(wt)} °C. Šaltinis: aukštesnė temperatūra = mažiau pagavimų; tyrimo temperatūrų intervalo nežinau, todėl skaičiaus nevertinu.`);
  if(pike){if(p.recent==='daug')A('EV5','-','Ežeras intensyviai žvejotas paskutines 2 d. Tai stipriausias iš tirtų veiksnių, tikėtini prastesni pagavimai.');
    else if(p.recent==='mažai')A('EV5','+','Paskutines 2 d. ežeras buvo mažai žvejotas. Palanku pagal šaltinį.');
    else A('EV5','info','Nenurodei, ar ežeras buvo žvejotas paskutines 2 d. Tai svarbiausias iš žinomų veiksnių, jei gali, sužinok.')}
  if(num(p.pressure)!=null)A('EV6','info',`Slėgis ${p.pressure} hPa${p.trend?' ('+p.trend.toLowerCase()+')':''}: šaltiniai nesutaria, įtaka neįrodyta, todėl neįvertinta.`);
  if(ice){const small=w&&((num(w.area)!=null&&num(w.area)<10)||(num(w.maxDepth)!=null&&num(w.maxDepth)<4));
    A('EV11',small?'-':'info',small?'Mažas arba seklus telkinys: po ledu deguonies stygiaus rizika didesnė (mano slenkstis: <10 ha arba <4 m, ne iš šaltinio). Ieškok įtekančių upelių ir gilesnių vietų.':'Telkinys nėra mažas ir seklus pagal mano slenkstį (<10 ha ar <4 m), bet deguonies po ledu pamatuoti negali.');
    A('EV12','info','Specializuotos spaudos hipotezė apie šviesą po ledu: nepatvirtinta, nenaudojama sprendimui.')}
  return out.map(o=>({...o,e:E(o.ev)}))}

/* ---- Statistika ir hipotezių testai ---- */
function tripHours(t){const sp=tripSpan(t);return sp?(sp[1]-sp[0])/60:0}
function catchesOf(t,sp){return (t.catches||[]).filter(c=>!sp||!sp.length||sp.includes(c.species))}
function median(a){const s=[...a].sort((x,y)=>x-y);if(!s.length)return null;const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function rateRatio(a,ta,b,tb,minTrips){ // a,b = žuvų skaičiai, ta,tb = valandos
  if(!(ta>0&&tb>0))return {ok:false,why:'trūksta valandų (reikia pradžios ir pabaigos laiko)'};
  if(a<1||b<1)return {ok:false,why:'vienoje grupėje nulis žuvų, santykio apskaičiuoti negalima'};
  const rr=(a/ta)/(b/tb);const se=Math.sqrt(1/a+1/b)*1.5;
  return {ok:true,rr,lo:Math.exp(Math.log(rr)-1.96*se),hi:Math.exp(Math.log(rr)+1.96*se),ra:a/ta,rb:b/tb}}
function verdict(res,exp){if(!res.ok)return 'nepakanka duomenų';
  const up=res.lo>1,down=res.hi<1;
  if(exp==='+')return up?'palaiko':down?'prieštarauja':'neapibrėžta';
  return down?'palaiko':up?'prieštarauja':'neapibrėžta'}
function evalHyp(h,trips,waters){
  const sp=h.sp;const base=trips.filter(t=>tripHours(t)>0);
  const mk=(A,B,labA,labB,extra)=>{
    const a=A.reduce((s,t)=>s+catchesOf(t,sp).length,0),b=B.reduce((s,t)=>s+catchesOf(t,sp).length,0);
    const ta=A.reduce((s,t)=>s+tripHours(t),0),tb=B.reduce((s,t)=>s+tripHours(t),0);
    const info={n:{A:A.length,B:B.length},fishA:a,fishB:b,hA:ta,hB:tb,labA,labB,extra};
    if(A.length<5||B.length<5||a+b<10)return {...info,res:{ok:false,why:'mažiausia imtis: 5 žvejybos kiekvienoje grupėje ir 10 žuvų iš viso'},verdict:'nepakanka duomenų'};
    const res=rateRatio(a,ta,b,tb);return {...info,res,verdict:verdict(res,h.exp)}};
  const open=base.filter(t=>!/žiemin/i.test(t.type||''));
  switch(h.test){
   case 'twilight':{let a=0,b=0,ta=0,tb=0,nt=0;
     base.forEach(t=>{const w=waters.find(x=>x.id===t.waterId||x.name===t.waterName);const ll=llFrom(w&&w.coords);
       const cs=catchesOf(t,sp);if(cs.some(c=>!c.time))return;const x=twilightMinutes(t,ll);if(!x)return;nt++;
       ta+=x.tw/60;tb+=(x.total-x.tw)/60;cs.forEach(c=>{const m=toMin(c.time);const mm=(m<toMin(t.start)?m+1440:m);const tw=twilightWindows(t.date,ll).some(([p,q])=>mm>=p&&mm<=q||mm-1440>=p&&mm-1440<=q);tw?a++:b++})});
     const info={n:{A:nt,B:nt},fishA:a,fishB:b,hA:ta,hB:tb,labA:'prieblanda',labB:'kitas laikas'};
     if(nt<5||a+b<10)return {...info,res:{ok:false,why:'mažiausia imtis: 5 žvejybos su laikais ir 10 žuvų iš viso'},verdict:'nepakanka duomenų'};
     const res=rateRatio(a,ta,b,tb);return {...info,res,verdict:verdict(res,h.exp)}}
   case 'wind':{const v=base.map(t=>num(t.w&&t.w.wind)).filter(x=>x!=null);const m=median(v);if(m==null)return mk([],[],'','');
     return mk(base.filter(t=>num(t.w&&t.w.wind)>m),base.filter(t=>num(t.w&&t.w.wind)!=null&&num(t.w.wind)<=m),'vėjas > '+fmt1(m)+' m/s','vėjas ≤ '+fmt1(m)+' m/s')}
   case 'moon':return mk(base.filter(t=>t.date&&moonNewFull(t.date,2)),base.filter(t=>t.date&&!moonNewFull(t.date,2)),'jaunatis/pilnatis ±2 d.','kitos dienos');
   case 'wtemp':{const v=open.map(t=>num(t.w&&t.w.wtemp)).filter(x=>x!=null);const m=median(v);if(m==null)return mk([],[],'','');
     return mk(open.filter(t=>num(t.w&&t.w.wtemp)!=null&&num(t.w.wtemp)<=m),open.filter(t=>num(t.w&&t.w.wtemp)>m),'vanduo ≤ '+fmt1(m)+' °C','vanduo > '+fmt1(m)+' °C')}
   case 'pressure2d':return mk(base.filter(t=>t.recent==='daug'),base.filter(t=>t.recent==='mažai'),'intensyviai žvejota','mažai žvejota');
   case 'airpressure':return mk(base.filter(t=>num(t.w&&t.w.pressure)!=null&&num(t.w.pressure)<1010),base.filter(t=>num(t.w&&t.w.pressure)>=1015),'<1010 hPa','≥1015 hPa');
  }
  return {res:{ok:false,why:'nežinomas testas'},verdict:'nepakanka duomenų',n:{A:0,B:0},fishA:0,fishB:0,hA:0,hB:0}}
function confLabel(trips,fish,hours){return (trips<5||fish<10||hours<10)?'žemas':(fish<30||trips<10)?'vidutinis':'aukštesnis'}

function norm(d){const x=typeof d.data==='function'?d.data():(d.data&&typeof d.data==='object'?d.data:d);return {...x,id:d.id||x.id}}
function rows(s){if(!s)return[];if(Array.isArray(s))return s.map(norm);const out=[];if(s.docs)s.docs.forEach(d=>out.push(norm(d)));else if(s.forEach)s.forEach(d=>out.push(norm(d)));return out}
function rawColl(c){return c==='trips'?[...S.trips,...(S.activeTrip?[S.activeTrip]:[])]:[...S[c]]}
function setColl(c,list){if(c==='trips'){S.activeTrip=list.find(t=>t.active)||null;S.trips=list.filter(t=>!t.active)}else S[c]=list}
async function initDb(){
  try{db=await (window.claude&&claude.use?claude.use('db'):null)}catch(e){db=null}
  if(!db){S.dbOK=false;$('#sync').textContent='tik šiam seansui';renderAll();return}
  S.dbOK=true;$('#sync').textContent='saugoma';
  COLL.forEach(c=>{try{db.collection(c).onSnapshot(s=>{setColl(c,rows(s));renderLive()},()=>{})}catch(e){}});
  setTimeout(renderAll,50);
}
async function save(c,o){
  o.id=o.id||uid();o.updated=Date.now();if(!o.created)o.created=o.updated;
  const clean=JSON.parse(JSON.stringify(o));
  if(db){try{await db.doc(c+'/'+clean.id).set(clean)}catch(e){toast('Nepavyko išsaugoti: '+(e.message||e));return false}}
  else{const a=rawColl(c);const i=a.findIndex(x=>x.id===clean.id);if(i>=0)a[i]=clean;else a.push(clean);setColl(c,a);renderLive()}
  return clean;
}
async function removeDoc(c,id){
  if(db){try{await db.doc(c+'/'+id).delete()}catch(e){toast('Nepavyko ištrinti');return}}
  else{setColl(c,rawColl(c).filter(x=>x.id!==id));renderLive()}
}
/* ---------- AI ---------- */
async function ai(prompt,images){
  const s=await (window.claude&&claude.use?claude.use('sample'):null);
  if(!s)throw new Error('Claude funkcija šiame lange nepasiekiama. Atidaryk puslapį per claude.ai.');
  const opts={modelTier:'default',cache:false};
  if(images&&images.length){let lim=null;try{lim=await s.limits()}catch(e){}
    if(!lim||!lim.images)throw new Error('Nuotraukų atpažinimas šiame lange nepasiekiamas.');opts.images=images}
  const r=await s(prompt,opts);return r.text||'';
}
function parseJSON(t){const a=Math.min(...['[','{'].map(c=>{const i=t.indexOf(c);return i<0?1e9:i}));
  const b=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));if(a>=1e9||b<0)throw new Error('Atsakymas be duomenų, bandyk dar kartą.');return JSON.parse(t.slice(a,b+1))}

function dur(t){if(!t.start||!t.end)return 0;const [a,b]=[t.start,t.end].map(x=>{const[h,m]=x.split(':').map(Number);return h*60+(m||0)});let d=b-a;if(d<0)d+=1440;return d/60}
function moon(ds){const d=new Date(ds+'T12:00:00Z');const syn=29.530588853;let a=((d-Date.UTC(2000,0,6,18,14))/864e5)%syn;if(a<0)a+=syn;
  const names=['Jaunatis','Jaunas, auga','Pirmas ketvirtis','Auga','Pilnatis','Senėja','Paskutinis ketvirtis','Senas, senėja'];
  return {name:names[Math.round(a/syn*8)%8],ill:Math.round((1-Math.cos(2*Math.PI*a/syn))/2*100)}}

async function startTrip(){
  if(S.activeTrip){S.tab='trip';renderAll();return}
  const b=S.brief,p=b?b.p:S.plan;
  if(!p.waterId){S.tab='trip';renderAll();toast('Pasirink vandenį');return}
  const w=waterById(p.waterId);const t=newTrip();
  t.active=true;t.date=today();t.start=nowHM();t.type=p.type;t.waterId=w?w.id:'';t.waterName=w?w.name:'';t.recent=p.recent||'';
  ['temp','wind','dir','sky','wtemp','pressure'].forEach(k=>{if(p[k])t.w[k]=p[k]});
  const r=await save('trips',t);if(!r)return;S.activeTrip=r;S.tab='trip';renderAll();window.scrollTo(0,0)}
async function endTrip(btn){
  const t=S.activeTrip;if(!t)return;if(!confirm_('Baigti žvejybą?',btn))return;
  const T=JSON.parse(JSON.stringify(t));T.end=nowHM();T.active=false;
  const w=S.waters.find(x=>x.id===T.waterId);const g=(T.catches||[]).filter(c=>c.lat);
  if(w&&!w.coords&&g.length){await save('waters',{...w,coords:median(g.map(c=>c.lat)).toFixed(6)+', '+median(g.map(c=>c.lon)).toFixed(6),coordsSrc:'nuotraukų EXIF'})}
  const r=await save('trips',T);if(!r)return;
  setColl('trips',[...rawColl('trips').filter(x=>x.id!==r.id),r]);renderAll();toast('Žvejyba išsaugota. Laimikių rūšį ir masalą gali pataisyti paspaudęs žvejybą.',5000)}

const SEASONS=['Pavasaris','Vasara','Ruduo','Žiema'];
const curSeason=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?'Pavasaris':m>=6&&m<=8?'Vasara':m>=9&&m<=11?'Ruduo':'Žiema'};
const MON=['sau','vas','kov','bal','geg','birž','liep','rugp','rugs','spal','lapkr','gruod'];
const idOfName=n=>Object.keys(FISH_NAME).find(k=>FISH_NAME[k]===n);
const fishWater=id=>`style="--a:${FISH_BG[id][0]};--b:${FISH_BG[id][1]}"`;
const catchesOfSpecies=name=>{const out=[];S.trips.forEach(t=>(t.catches||[]).forEach(c=>{if(c.species===name)out.push({c,t})}));return out};

function ruleChips(name){
  const r=SPECIES_RULES[name];if(!r)return '';
  const chips=[];
  const closed=(r.closed||[]).map(([m1,d1,m2,d2])=>`${MON[m1-1]}. ${d1} – ${MON[m2-1]}. ${d2}`);
  const isClosed=(r.closed||[]).some(rg=>dInRange(today(),rg));
  chips.push(`<span class="pill ${isClosed?'bad':'good'}">šiandien ${isClosed?'draudžiama':'galima'}</span>`);
  if(closed.length)chips.push(`<span class="chip-lite">draudimas ${closed.join(', ')}</span>`);
  if(r.limit)chips.push(`<span class="chip-lite">limitas ${r.limit}</span>`);
  if(r.min)chips.push(`<span class="chip-lite">${r.min}${r.max?'–'+r.max:'+'} cm</span>`);
  return chips.join('');
}

/* perėjimas: kortelė išsiskleidžia į visą ekraną */
function openStage(html,fromEl,after){
  const st=$('#stage');
  const show=()=>{if(fromEl)fromEl.style.viewTransitionName='';st.innerHTML=html;st.hidden=false;document.body.classList.add('noscroll');requestAnimationFrame(()=>st.classList.add('open'));initReveal();st.scrollTop=0;if(after)after()};
  if(document.startViewTransition&&fromEl&&!reduceMotion()){fromEl.style.viewTransitionName='hero';const vt=document.startViewTransition(show);vt.finished.finally(()=>{const h=st.querySelector('[data-hero]');if(h)h.style.viewTransitionName=''})}
  else show();
}
function closeStage(){const st=$('#stage');stopKnot();st.classList.remove('open');setTimeout(()=>{st.hidden=true;st.innerHTML='';document.body.classList.remove('noscroll')},reduceMotion()?0:260)}
function initReveal(){
  const els=[...document.querySelectorAll('#stage .rv')];
  if(!('IntersectionObserver' in window)||reduceMotion()){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{root:$('#stage'),threshold:.12});
  els.forEach(e=>io.observe(e));
}
const bubbles=()=>Array.from({length:7},(_,i)=>`<i class="bub" style="left:${8+i*13}%;animation-delay:${(i*.7)%3}s;width:${5+(i%3)*4}px;height:${5+(i%3)*4}px"></i>`).join('');

let KN=null;let knotTimer=null;
function stopKnot(){clearInterval(knotTimer);knotTimer=null;KN=null}
VIEWS.knots=function(){
  return `<div class="hero"><div class="eyebrow">Žinynas</div><h1>Mazgai</h1><div class="muted small" style="margin-top:4px">Pasirink mazgą ir pažiūrėk, kaip jis veda žingsnis po žingsnio. Tai schemos, ne nuotraukos.</div></div>
  <div class="list">${KNOTS.map((k,i)=>`<button class="item kcard" data-act="knotOpen" data-v="${i}" style="--d:${i*.06}s"><div class="kthumb">${(KNOT_ART[k.name]||[''])[ (KNOT_ART[k.name]||[]).length-1 ].replace('class="kscene"','class="kscene still"')}</div>
   <div class="grow"><b>${k.name}</b><div class="muted small">${k.use}</div><div class="small" style="margin-top:6px"><span class="badge">${k.steps.length} žingsniai</span></div></div></button>`).join('')}</div>`};
function knotStage(i,fromEl){
  const k=KNOTS[i];if(!k)return;KN={i,s:0,play:true};
  openStage(`<div class="stage-scroll"><article class="kstage"><header class="ks-top"><button class="xbtn dark" data-act="stageClose" aria-label="Uždaryti">×</button><div class="eyebrow">Mazgas</div><h1 data-hero style="view-transition-name:hero">${k.name}</h1><div class="muted small">${k.use}</div></header><div id="kbody"></div></article></div>`,fromEl,()=>{renderKnot();startKnotTimer()});
}
function renderKnot(){
  if(!KN)return;const k=KNOTS[KN.i],art=KNOT_ART[k.name]||[];const n=k.steps.length;
  const sc=art[Math.min(KN.s,art.length-1)]||'';
  $('#kbody').innerHTML=`<div class="kstageBox">${sc}<div class="kprog">${k.steps.map((_,j)=>`<button data-act="knotGo" data-v="${j}" class="kdot ${j===KN.s?'on':j<KN.s?'done':''}" aria-label="Žingsnis ${j+1}"></button>`).join('')}</div></div>
   <div class="kcap" key="${KN.s}"><div class="knum">${KN.s+1}<span>/${n}</span></div><p>${k.steps[KN.s]}</p></div>
   <div class="row kctl"><button class="btn" data-act="knotStep" data-v="-1" ${KN.s===0?'disabled':''}>Atgal</button>
   <button class="btn" data-act="knotPlay">${KN.play?'Sustabdyti':'Leisti'}</button>
   <button class="btn primary" data-act="knotStep" data-v="1" ${KN.s===n-1?'disabled':''}>Toliau</button></div>`;
}
function startKnotTimer(){clearInterval(knotTimer);knotTimer=setInterval(()=>{if(!KN||!KN.play)return;const n=KNOTS[KN.i].steps.length;if(KN.s<n-1){KN.s++;renderKnot()}else{KN.play=false;renderKnot()}},3600)}

/* ---------- stats ---------- */
function barRows(rows,labelFn){
  rows=rows.filter(r=>r.hours>0);if(!rows.length)return '<div class="muted small">Dar nėra duomenų (reikia žvejybų su pradžios ir pabaigos laiku).</div>';
  const mx=Math.max(...rows.map(r=>r.fish/r.hours))||1;
  return `<div class="bars">${rows.map(r=>{const rt=r.fish/r.hours;const cf=confLabel(r.trips,r.fish,r.hours);return `<div class="bar-row"><span>${esc(labelFn(r.k))}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,rt/mx*100)}%"></div></div><span class="small"><b>${fmt1(rt)}</b>/val. <span class="muted">(${r.fish} ž., ${r.trips} žv., ${fmt1(r.hours)} val.)</span> <span class="pill ${cf==='žemas'?'warn':cf==='vidutinis'?'':'good'}" ${cf==='vidutinis'?'style="background:var(--muted)"':''}>${cf}</span></span></div>`}).join('')}</div>`}
function grp(keyFn){const m={};S.trips.forEach(t=>{const k=keyFn(t);if(k==null||k==='')return;const o=m[k]||(m[k]={k,trips:0,hours:0,fish:0});o.trips++;o.hours+=tripHours(t);o.fish+=(t.catches||[]).length});return Object.values(m)}
const fmtRR=r=>fmt1(r);
function hypCard(h){
  const r=evalHyp(h,S.trips,S.waters);const snaps=S.hyp.filter(x=>x.hid===h.id).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  const vcls={'palaiko':'good','prieštarauja':'bad','neapibrėžta':'warn','nepakanka duomenų':'warn'}[r.verdict];
  const body=r.res.ok?`Santykis (RR) ${fmtRR(r.res.rr)}, 95% intervalas ${fmtRR(r.res.lo)}–${fmtRR(r.res.hi)}. ${esc(r.labA)}: ${r.fishA} ž. per ${fmt1(r.hA)} val. (${fmt1(r.fishA/r.hA)}/val.). ${esc(r.labB)}: ${r.fishB} ž. per ${fmt1(r.hB)} val. (${fmt1(r.fishB/r.hB)}/val.).`
    :`${esc(r.res.why||'')}. Šiuo metu: ${r.n.A||0} ir ${r.n.B||0} žvejybų, ${r.fishA+r.fishB} žuvų.`;
  return `<details class="card hyp"><summary><span class="grow">${h.id} · ${esc(h.text.length>70?h.text.slice(0,68)+'…':h.text)}</span><span class="pill ${vcls}">${r.verdict}</span></summary>
   <p style="margin:10px 0 6px">${esc(h.text)}</p>
   <div class="small muted">Pagrindas: ${h.ev.map(e=>{const ev=EVID.find(x=>x.id===e);return e+' ('+ev.src.join(', ')+')'}).join('; ')}. Tikėtina kryptis: ${h.exp==='+'?'daugiau pirmoje grupėje':'mažiau pirmoje grupėje'}.</div>
   <div class="small" style="margin:6px 0">${body}</div>
   ${snaps.length?`<div class="small muted">Įrašyta ${snaps.length} kart. Paskutinis: ${esc(snaps[0].date)}, ${esc(snaps[0].verdict)}${snaps[0].fishA!=null?' ('+(snaps[0].fishA+snaps[0].fishB)+' ž.)':''}${snaps.length>1&&snaps[1].verdict!==snaps[0].verdict?'; anksčiau: '+esc(snaps[1].verdict):''}.</div>`:''}
   <button class="btn sm" data-act="hypSave" data-v="${h.id}">Įvertinti ir įrašyti</button></details>`}
function statsHTML(){

  if(n<1)return '<h2>Analizė</h2><div class="card">Analizė atsiras, kai įrašysi pirmas žvejybas su pradžios ir pabaigos laiku bei laimikių nuotraukomis. Hipotezės (žemiau) neįvertinamos, kol imtis nepasiekia mažiausios ribos.</div><h3>Hipotezės</h3>'+HYP.map(hypCard).join('');
  const fish=tripsFish(),hrs=S.trips.reduce((a,t)=>a+tripHours(t),0);
  const mn=t=>t.date?MONTHS[+t.date.slice(5,7)-1]:null;
  const lureMap={};S.trips.forEach(t=>(t.catches||[]).forEach(c=>{const k=lureLabel(c)||'(masalas nenurodytas)';lureMap[k]=(lureMap[k]||0)+1}));
  const lures=Object.entries(lureMap).sort((a,b)=>b[1]-a[1]);
  const hist={};S.trips.forEach(t=>(t.catches||[]).forEach(c=>{if(!c.time)return;const h=+c.time.split(':')[0];hist[h]=(hist[h]||0)+1}));
  const hk=Object.keys(hist).map(Number);let hh='';
  if(hk.length){const a=Math.min(...hk),b=Math.max(...hk),mx=Math.max(...Object.values(hist));
    hh='<div class="hist">'+Array.from({length:b-a+1},(_,i)=>{const h=a+i,v=hist[h]||0;return `<div><span>${v||''}</span><i style="height:${v/mx*80}%"></i><span>${h}</span></div>`}).join('')+'</div>'}
  const sp={};S.trips.forEach(t=>(t.catches||[]).forEach(c=>{if(c.species)sp[c.species]=(sp[c.species]||0)+1}));
  const sec=(t,b)=>`<div class="card"><h3>${t}</h3><div style="margin-top:10px">${b}</div></div>`;
  const cf=confLabel(n,fish,hrs);
  return `<h2>Analizė</h2>
  <div class="banner">Imtis: ${n} žvejybų, ${fish} žuvų, ${fmt1(hrs)} valandų. Bendras pasitikėjimas: <b>${cf}</b>. Žemas reiškia mažiau nei 5 žvejybų, 10 žuvų ar 10 valandų, vidutinis mažiau nei 10 žvejybų ar 30 žuvų (mano slenksčiai, ne iš literatūros).</div>
  <h3>Hipotezės iš šaltinių</h3>${HYP.map(hypCard).join('')}
  ${sec('Ant ko kimba (tik pagavimai)',lures.length?`<div class="small muted" style="margin-bottom:8px">Čia nėra bandymų skaičiaus, nes masalų keitimo neloguoji. Lentelė rodo, ką naudoji ir kas pagavo, bet NERODO, kuris masalas efektyvesnis.</div><div class="scroll-x"><table><tr><th>Masalas</th><th>Pagavimai</th></tr>${lures.map(l=>`<tr><td>${esc(l[0])}</td><td>${l[1]}</td></tr>`).join('')}</table></div>`:'<div class="muted small">Dar nėra pagavimų.</div>')}
  ${sec('Rūšys',Object.keys(sp).length?`<div class="chips">${Object.entries(sp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="badge">${esc(k)} ${v}</span>`).join('')}</div>`:'<div class="muted small">Dar nėra pagautų žuvų.</div>')}
  ${sec('Kibimai pagal valandą',hh||'<div class="muted small">Pagavimų laikas paimamas iš nuotraukų EXIF.</div>')}
  ${sec('Pagal mėnesį',barRows(grp(mn).sort((a,b)=>MONTHS.indexOf(a.k)-MONTHS.indexOf(b.k)),k=>k))}
  ${sec('Pagal vandenį',barRows(grp(t=>t.waterName).sort((a,b)=>b.fish/(b.hours||1)-a.fish/(a.hours||1)),k=>k))}
  ${sec('Pagal žvejybos tipą',barRows(grp(t=>t.type),k=>k))}
  <div class="row"><button class="btn" data-act="exportData">Eksportuoti duomenis (JSON)</button></div>`}

function gearSummary(cats){return S.gear.filter(g=>!cats||cats.includes(g.cat)).map(g=>`${g.id} | ${CATS[g.cat]?.one||g.cat}: ${glFull(g)}${g.type?' ['+g.type+']':''}${g.qty&&g.qty!=1?' x'+g.qty:''}${g.specs?' ('+g.specs+')':''}`).join('\n')||'(spinta tuščia)'}
function waterHistory(w){
  const ts=S.trips.filter(t=>t.waterId===w.id||t.waterName===w.name);if(!ts.length)return 'Šiame vandenyje žvejybų žurnale dar nėra.';
  const sp={},lu={};ts.forEach(t=>(t.catches||[]).forEach(c=>{sp[c.species]=(sp[c.species]||0)+1;const k=lureLabel(c);if(k)lu[k]=(lu[k]||0)+1}));
  const h=ts.reduce((a,t)=>a+tripHours(t),0);
  return `${ts.length} žvejybų, ${fmt1(h)} val.; pagavimai pagal rūšį: ${Object.entries(sp).map(([k,v])=>k+' '+v).join(', ')||'nėra'}; pagavimai pagal masalą: ${Object.entries(lu).map(([k,v])=>k+' '+v).join(', ')||'nėra'}`}
function tripsSummary(){return S.trips.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(t=>`${t.date} ${t.waterName||''} | ${t.type||''} ${t.start||''}-${t.end||''} | ${wline(t.w)} | vand. ${t.w?.wtemp||'?'}°C | kibimai: ${(t.catches||[]).map(c=>[c.species,c.len&&c.len+'cm',c.time,lureLabel(c)].filter(Boolean).join(' ')).join('; ')||'nieko'}`).join('\n')||'(žurnalas tuščias)'}
const SYS='Tu padedi Lietuvos žvejui Arnui. Atsakyk lietuviškai, tiesmukai, be įžangos, be emoji ir be tuščių frazių. Nespėliok faktų ir skaičių; jei duomenų ar šaltinio nėra, taip ir pasakyk.\n';

async function runAI(btn,outId,key,promptFn){
  const out=$('#'+outId);btn.disabled=true;const old=btn.textContent;btn.textContent='Galvoju…';out.hidden=false;out.textContent='';
  try{const t=await ai(promptFn());S.out[key]=t;out.innerHTML=md(t)}catch(e){out.textContent=e.message||String(e)}
  btn.disabled=false;btn.textContent=old}

const LVL={stop:['draudimas','bad'],warn:['patikrinti','warn'],ok:['galima','good'],info:['taisyklė','']};
function legalHTML(items){
  const order=['stop','warn','ok','info'];const stops=items.filter(i=>i.lvl==='stop');
  const head=stops.length?`<div class="banner" style="border-left-color:var(--bad)"><b>Yra draudimų (${stops.length}).</b> Nežvejok, kol jų nepatikrinai.</div>`:'';
  return head+order.flatMap(l=>items.filter(i=>i.lvl===l)).map(i=>`<div class="lrow"><span class="pill ${LVL[i.lvl][1]}" ${i.lvl==='info'?'style="background:var(--muted)"':''}>${LVL[i.lvl][0]}</span><span>${esc(i.text)} ${i.src?srcChip(i.src):''}</span></div>`).join('')}
function condHTML(rows){
  if(!rows.length)return '<div class="muted small">Įvesk datą, pradžios laiką ir prognozę, tada pamatysi, ką apie jas sako šaltiniai.</div>';
  const st={'+':['palaiko','good'],'-':['nepalankus','bad'],'0':['neutralu',''],'info':['info','']};
  return rows.map(r=>`<div class="lrow"><span class="pill ${st[r.state][1]}" ${!st[r.state][1]?'style="background:var(--muted)"':''}>${st[r.state][0]}</span><span><b>${esc(r.e.f)}.</b> ${esc(r.txt)} <span class="muted small">Šaltinio teiginys: ${esc(r.e.claim)} (pasitikėjimas ${r.e.conf}).</span> ${srcChips(r.e.src)}</span></div>`).join('')}

function briefPrompt(p,w,cond){
  const cats=/žiemin/i.test(p.type)?['ice','lure','terminal','line']:['lure','terminal','line'];
  const ev=EVID.map(e=>`${e.id} [${e.f}; pasitikėjimas ${e.conf}; taikomumas: ${e.ap}] ${e.claim} (šaltiniai ${e.src.join(',')||'nėra'})`).join('\n');
  return `Tu padedi Arnui paruošti žvejybos brifo dalį "masalų komplektas ir sistema". Grąžink TIK JSON, be kito teksto.
GRIEŽTOS TAISYKLĖS:
1. Masalus renkiesi TIK iš žemiau pateiktos spintos, naudok jų id. Jei reikiamo nėra, įrašyk į "gaps" (tipas ir parametrai, ne prekės ženklas).
2. Kiekvienas pasirinkimas privalo turėti "evid" (įrodymų ID iš sąrašo žemiau) arba "basis". Jei įrodymo nėra, "evid":[] ir nieko nerašyk apie veiksmingumą.
3. Konkretaus masalo veiksmingumui (spalva, tipas, dydis) literatūros įrodymų NĖRA (EV13). Todėl masalų parinkimo pagrindas yra: "pagavimai" (jo paties pagavimai šiame vandenyje, žemiau) arba "metodinis" (komplektas turi apimti skirtingus pateikimo būdus: skirtingą greitį ir gylį, kad jo duomenys sužinotų daugiau). Neteigk, kad konkretus masalas "kimba geriau" be duomenų.
4. Nespėliok gylių, vedimo greičių, spalvų ar sezoninių taisyklių, kurių nepagrindžia pateikti įrodymai. Jei nežinai, įrašyk į "unknowns".
5. "confidence" yra "vidutinis" tik jei evid įrašo pasitikėjimas vidutinis; visais kitais atvejais "žemas".
6. Sistemai (rig) lydekai ir kietiesiems masalams naudok EV8. Atsižvelk į teisinius apribojimus: iš viso iki 6 kabliukų, gumos iki 40 cm, jei ledas ir žvejoji su žuvele, tik iki 2 įrankių su žuvele.
7. Rekomenduok 2-4 masalus: vieną "pagrindinis", vieną "atsarginis", pagal poreikį "tyrimui" (kitoks pateikimas, kad atsirastų duomenų).
SCHEMA: {"sets":[{"role":"pagrindinis|atsarginis|tyrimui","lureId":"id iš spintos arba ''","lureText":"jei lureId tuščias","target":"rūšis","presentation":"trumpai, tik jei pagrįsta","why":"1-2 sakiniai","evid":["EV.."],"basis":"pagavimai|metodinis|''","confidence":"žemas|vidutinis"}],"rig":[{"item":"","why":"","evid":["EV8"],"basis":""}],"gaps":[""],"unknowns":[""]}

IŠVYKA: ${p.date} ${p.time||'?'}-${p.end||'?'}, ${p.type}, tikslas: ${(p.species||[]).join(', ')||'nenurodyta'}.
VANDUO: ${w?`${w.name}, ${w.kind||''}, ${w.area||'?'} ha, didž. gylis ${w.maxDepth||'?'} m, vid. gylis ${w.meanDepth||'?'} m. ${w.notes||''}`:'nepasirinktas'}
JO PAGAVIMAI ŠIAME VANDENYJE: ${w?waterHistory(w):'—'}
PROGNOZĖ: oras ${p.temp||'?'}°C, vėjas ${p.dir||''} ${p.wind||'?'} m/s, ${p.sky||''}, vandens temp. ${p.wtemp||'?'}°C. Žvejotas paskutines 2 d.: ${p.recent||'nežinoma'}.
SĄLYGŲ VERTINIMAS (programos): ${cond.map(c=>c.ev+':'+c.state).join(', ')||'—'}
ĮRODYMAI:\n${ev}
SPINTA (id | daiktas):\n${gearSummary(cats)}`}

async function prep(file){
  const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Nepavyko atidaryti nuotraukos'));i.src=u});
  const sc=mx=>{const r=Math.min(1,mx/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c};
  const blob=await new Promise(r=>sc(1400).toBlob(r,'image/jpeg',.85));
  return {blob,thumb:sc(160).toDataURL('image/jpeg',.7)}}
async function recognize(files){
  const found=[];
  for(let n=0;n<files.length;n++){
    toast(`Atpažįstu ${n+1} iš ${files.length}…`,60000);
    const {blob,thumb}=await prep(files[n]);
    const t=await ai(`Tu atpažįsti žvejybos įrangą nuotraukoje (pakuotė, masalas, meškerė, ritė, valas, valtis, variklis ir t.t.). Perskaityk visą tekstą ant pakuotės. Grąžink TIK JSON masyvą, be jokio kito teksto. Kiekvienas elementas:
{"cat":"rod|reel|line|lure|terminal|ice|boat|motor|sonar|tool|clothing|other","type":"lietuviškai, pvz. Vobleris, Gumytė, Blizgė, Pintas, Mormyška","brand":"","model":"","size":"ilgis cm / dydis / skersmuo, kaip parašyta","weight":"g ar kitas svoris, kaip parašyta","color":"spalva ar spalvos kodas","qty":1,"specs":"veikimas (plūduriuojantis/skęstantis), nardymo gylis, galia, testas ir kita, kas parašyta","notes":"","confidence":"high|medium|low"}
Jei nuotraukoje keli skirtingi daiktai, grąžink kiekvienam atskirą elementą. Jei lauko ant daikto nematyti, palik "" ir nespėliok. qty yra kiekis pakuotėje, jei matyti.`,[blob]);
    parseJSON(t).forEach(x=>found.push(newGear({...x,thumb})));
  }
  return found}

async function prepCatch(file){
  const buf=await file.arrayBuffer();const ex=parseExif(buf);
  const {blob}=await prep(file);
  const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Nepavyko atidaryti nuotraukos'));i.src=u});
  const r=Math.min(1,220/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {blob,thumb:c.toDataURL('image/jpeg',.7),ex}}
async function addCatchPhotos(files){
  const T=M.data;const lures=S.gear.filter(g=>['lure','ice'].includes(g.cat));
  for(let n=0;n<files.length;n++){
    toast(`Skaitau nuotrauką ${n+1} iš ${files.length}…`,60000);
    const {blob,thumb,ex}=await prepCatch(files[n]);
    const c={time:ex.time||'',date:ex.date||'',exif:!!ex.time,species:'Lydeka',len:'',lureId:'',lureText:'',note:'',released:true,thumb,lat:ex.lat||null,lon:ex.lon||null,conf:'medium'};
    try{
      const t=await ai(`Nuotraukoje žvejo laimikis. Grąžink TIK JSON objektą be kito teksto: {"species":"${SPECIES.join('|')}","lureId":"id iš sąrašo, tik jei nuotraukoje aiškiai matomas būtent tas masalas","lureText":"jei masalas matomas, bet jo nėra sąraše, aprašyk trumpai (tipas, spalva, dydis); kitaip ''","len":"ilgis cm TIK jei nuotraukoje matyti matuoklė ar liniuotė su skale; kitaip ''","conf":"high|medium|low"}
Nespėliok: jei masalo nematyti, palik lureId ir lureText tuščius. Žuvies ilgio iš akies NEVERTINK.
Masalai spintoje (id = pavadinimas):\n${lures.map(g=>g.id+' = '+glFull(g)).join('\n')||'(nėra)'}`,[blob]);
      const o=parseJSON(t);if(SPECIES.includes(o.species))c.species=o.species;if(o.lureId&&lures.some(g=>g.id===o.lureId))c.lureId=o.lureId;else if(o.lureText)c.lureText=String(o.lureText);
      if(o.len)c.len=String(o.len);c.conf=['high','medium','low'].includes(o.conf)?o.conf:'medium';
    }catch(e){c.conf='low';c.note='Atpažinimas nepavyko: '+(e.message||e)}
    T.catches.push(c);
    if(c.date&&T.date&&c.date!==T.date)toast('Nuotraukos data '+c.date+' skiriasi nuo žvejybos datos '+T.date,6000);
  }
  toast('Pridėta '+files.length+'. Patikrink rūšį ir masalą.');
  if($('#catches'))$('#catches').innerHTML=T.catches.map(catchHTML).join('')}

/* vandens langas */

  const f=(k,l,ph='')=>`<label class="f">${l}<input data-w="${k}" value="${esc(k.split('.').reduce((o,x)=>o&&o[x],w)??'')}" placeholder="${ph}"></label>`;
  const L=w.legal;
  openModal(`<div class="bar"><h3>${w.id?'Vanduo':'Naujas vanduo'}</h3><button class="btn sm" data-act="mclose">Uždaryti</button></div>
  <div class="grid2">${f('name','Pavadinimas')}<label class="f">Tipas<select data-w="kind">${['Ežeras','Upė','Tvenkinys','Kūdra','Kita'].map(x=>`<option${x===w.kind?' selected':''}>${x}</option>`).join('')}</select></label>
  ${f('region','Rajonas / vieta')}${f('area','Plotas ha')}${f('maxDepth','Didžiausias gylis m')}${f('meanDepth','Vidutinis gylis m')}${f('bottom','Dugnas / struktūra')}${f('coords','Koordinatės (lat, lon)','54.633432, 24.796452')}</div>
  <div class="sect">Teisinis statusas (nuo jo priklauso brifas)</div>
  <div class="grid2"><label class="f">Statusas<select data-w="legal.status">${['','neišnuomotas','išnuomotas','limituota','ekologinis','uždraustas'].map(x=>`<option value="${x}"${x===(L.status||'')?' selected':''}>${x||'nežinomas'}</option>`).join('')}</select></label>
  ${f('legal.tenant','Nuomininkas / leidimo davėjas')}${f('legal.ticket','Reikalingas dokumentas')}${f('legal.boat','Valtis ir variklis')}
  <label class="f">Statusas patikrintas<input type="date" data-w="legal.checked" value="${esc(L.checked||'')}"></label>
  <label class="f">Šaltinis<select data-w="legal.src">${['','A3','A5','B1','A6'].map(x=>`<option${x===(L.src||'')?' selected':''}>${x}</option>`).join('')}</select></label></div>
  <label class="check"><input type="checkbox" data-w="legal.verifiedPrimary"${L.verifiedPrimary?' checked':''}> Patikrinta pirminiame teisės akte ar ALIS</label>
  <label class="f">Dar reikia patikrinti<input data-w="legal.todo" value="${esc(L.todo||'')}"></label>
  <label class="f">Pastabos (kur ką pagavai, geriausios vietos, ko vengti)<textarea data-w="notes" rows="3">${esc(w.notes)}</textarea></label>
  <div class="sect">Teisinė suvestinė šiandien (spiningas)</div><div id="wLegal">${legalHTML(legal(w,'Spiningas iš kranto',today(),['Lydeka','Starkis']))}</div>
  <button class="btn primary" data-act="wsave">Išsaugoti</button>${w.id?'<button class="btn danger" data-act="wdel">Ištrinti</button>':''}`)}

/* ---------- events ---------- */
let pendingFiles='';
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
   case 'tab':S.tab=v;if(v==='more')S.more='';S._anim=true;renderAll();window.scrollTo(0,0);break;
   case 'more':S.more=v;S._anim=true;renderMain();window.scrollTo(0,0);break;
   case 'ptype':S.plan.type=v;if(/žiemin/i.test(v)){if(!S.plan.species.length)S.plan.species=['Ešerys']}renderMain();break;
   case 'fishOpen':fishStage(v,b);break;
   case 'stageClose':closeStage();break;
   case 'season':{const f=FISH.find(x=>x.id===b.dataset.f);const box=$('#seasonBox');if(f&&box){document.querySelectorAll('#segS button').forEach(x=>x.setAttribute('aria-pressed',x===b));box.classList.remove('swap');void box.offsetWidth;box.textContent=f.seasons[v];box.classList.add('swap')}break}
   case 'knotOpen':knotStage(+v,b);break;
   case 'knotStep':if(KN){KN.s=Math.max(0,Math.min(KNOTS[KN.i].steps.length-1,KN.s+ +v));KN.play=false;renderKnot()}break;
   case 'knotGo':if(KN){KN.s=+v;KN.play=false;renderKnot()}break;
   case 'knotPlay':if(KN){const n=KNOTS[KN.i].steps.length;if(!KN.play&&KN.s>=n-1)KN.s=0;KN.play=!KN.play;renderKnot()}break;
   case 'planClose':S.planOpen=false;renderMain();break;
   case 'planOpen':S.planOpen=true;renderMain();break;
   case 'startTrip':startTrip();break;
   case 'endTrip':endTrip(b);break;
   case 'catchNow':window._camTarget='active';$('#cfile').click();break;
   case 'cat':S.cat=v;renderMain();break;
   case 'gsub':S.sub=v;renderMain();break;
   case 'fish':S.fish=v;renderMain();window.scrollTo(0,0);break;
   case 'srcgo':{S.tab='more';S.more='guide';S.sub='src';renderAll();const el=$('#src_'+v);if(el){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--hot)'}break}
   case 'tgt':{const s=S.plan.species;const i=s.indexOf(v);i>=0?s.splice(i,1):s.push(v);b.setAttribute('aria-pressed',i<0);break}
   case 'mclose':closeModal();break;
   case 'gearPhoto':pendingFiles='new';$('#file').click();break;
   case 'gphoto2':pendingFiles='add';$('#file').click();break;
   case 'gearManual':M={kind:'gear',data:[newGear()]};renderBatch();break;
   case 'gmore':M.data.push(newGear());renderBatch();break;
   case 'gdrop':M.data.splice(+v,1);if(!M.data.length)closeModal();else renderBatch();break;
   case 'editGear':{const g=S.gear.find(x=>x.id===v);if(g){M={kind:'gear',data:[{...g}]};renderBatch()}break}
   case 'gsave':{b.disabled=true;let n=0;for(const g of M.data){if(!g.brand&&!g.model&&!g.type&&!g.name)continue;const r=await save('gear',{...g,qty:num(g.qty)||1});if(r)n++}closeModal();toast(n+' išsaugota');break}
   case 'gdel':if(confirm_('Ištrinti šį daiktą iš spintos?',b)){await removeDoc('gear',M.data[0].id);closeModal()}break;
   case 'newTrip':{const t=newTrip();const pl=S.plan;if(S.brief&&S.brief.p){t.date=S.brief.p.date||t.date;t.type=S.brief.p.type||t.type;t.waterName=S.brief.water?S.brief.water.name:'';t.recent=S.brief.p.recent||'';
       ['temp','wind','dir','sky','wtemp','pressure'].forEach(k=>{if(S.brief.p[k])t.w[k]=S.brief.p[k]})}
     M={kind:'trip',data:t,mic:false};initMic();renderTrip();break}
   case 'editTrip':{const t=S.trips.find(x=>x.id===v)||(S.activeTrip&&S.activeTrip.id===v?S.activeTrip:null);if(t){M={kind:'trip',data:JSON.parse(JSON.stringify({...newTrip(),...t,w:{...newTrip().w,...(t.w||{})}})),mic:false};initMic();renderTrip()}break}
   case 'now':{M.data[v]=nowHM();const i=$(`[data-t="${v}"]`);if(i)i.value=M.data[v];break}
   case 'cphoto':$('#cfile').click();break;
   case 'cadd':{const T=M.data;T.catches=T.catches||[];T.catches.push({time:'',species:'Lydeka',len:'',lureId:'',lureText:'',note:'',released:true,exif:false});$('#catches').innerHTML=T.catches.map(catchHTML).join('');break}
   case 'cdrop':M.data.catches.splice(+v,1);$('#catches').innerHTML=M.data.catches.map(catchHTML).join('');break;
   case 'tsave':{const T=M.data;if(!T.date){toast('Įrašyk datą');return}b.disabled=true;
     let w=S.waters.find(x=>normName(x.name)===normName(T.waterName));
     if(!w&&T.waterName&&T.waterName.trim()){w=await save('waters',{name:T.waterName.trim(),kind:'Ežeras'})}
     if(w){T.waterId=w.id;T.waterName=w.name;
       const g=(T.catches||[]).filter(c=>c.lat);if(!w.coords&&g.length){const lat=median(g.map(c=>c.lat)),lon=median(g.map(c=>c.lon));await save('waters',{...w,coords:lat.toFixed(6)+', '+lon.toFixed(6),coordsSrc:'nuotraukų EXIF'})}}
     const r=await save('trips',T);closeModal();if(r)toast('Žvejyba išsaugota');break}
   case 'tdel':if(confirm_('Ištrinti šią žvejybą?',b)){await removeDoc('trips',M.data.id);closeModal()}break;
   case 'newWater':waterModal({name:'',kind:'Ežeras',region:'',area:'',maxDepth:'',meanDepth:'',bottom:'',coords:'',notes:'',legal:{}});break;
   case 'editWater':{const w=S.waters.find(x=>x.id===v);if(w)waterModal(JSON.parse(JSON.stringify(w)));break}
   case 'wsave':{if(!M.data.name.trim()){toast('Įrašyk pavadinimą');return}await save('waters',M.data);closeModal();break}
   case 'wdel':if(confirm_('Ištrinti vandenį? Žvejybos išliks.',b)){await removeDoc('waters',M.data.id);closeModal()}break;
   case 'kbImport':{const k=KB_WATERS.find(x=>x.name===v);if(k){await save('waters',JSON.parse(JSON.stringify({...k,kbSeed:true})));toast(k.name+' įkeltas. Statusą prieš žvejybą patikrink ALIS.',6000)}break}
   case 'tripAI':tripFromText(b);break;
   case 'mic':toggleMic(b);break;
   case 'briefGo':briefGo(b);break;
   case 'hypSave':{const h=HYP.find(x=>x.id===v);const r=evalHyp(h,S.trips,S.waters);
     await save('hyp',{hid:h.id,date:today(),verdict:r.verdict,rr:r.res.ok?r.res.rr:null,lo:r.res.ok?r.res.lo:null,hi:r.res.ok?r.res.hi:null,fishA:r.fishA,fishB:r.fishB,hA:r.hA,hB:r.hB,nA:r.n.A,nB:r.n.B,labA:r.labA||'',labB:r.labB||''});toast(h.id+' įrašyta');break}
   case 'exportData':{const dump=JSON.stringify({exported:new Date().toISOString(),gear:S.gear.map(({thumb,...g})=>g),waters:S.waters,trips:S.trips.map(t=>({...t,catches:(t.catches||[]).map(({thumb,...c})=>c)})),hyp:S.hyp,briefs:S.briefs},null,1);
     openModal(`<div class="bar"><h3>Duomenų eksportas</h3><button class="btn sm" data-act="mclose">Uždaryti</button></div><textarea id="dump" rows="14" readonly style="width:100%;font-family:monospace;font-size:.75rem">${esc(dump)}</textarea><button class="btn primary" data-act="dumpCopy">Pažymėti viską ir kopijuoti</button><div class="small muted">Nuotraukų miniatiūros į eksportą neįtraukiamos.</div>`);break}
   case 'dumpCopy':{const t=$('#dump');t.select();try{await navigator.clipboard.writeText(t.value);toast('Nukopijuota')}catch(e){toast('Pažymėta, nukopijuok rankiniu būdu (Ctrl+C)')}break}
   case 'shopGo':runAI(b,'shopOut','shop',()=>SYS+`Išanalizuok mano spintą ir žurnalą ir pasakyk, ko galiu pirkti. Kiekvienai rekomendacijai privalai nurodyti PAGRINDĄ iš trijų: "taisyklės" (pvz. teisinis reikalavimas, smaigai ant ledo), "tavo duomenys" (pagal žurnalą ir spintą), arba "bendra praktika (nepatvirtinta)". Neišgalvok prekių: nurodyk tipą ir parametrus, ne modelį. Jei duomenų neužtenka, pasakyk. Žiemos ir saugos daiktus rašyk pirmiausia. Atsižvelk į teisinius apribojimus (iki 6 kabliukų, gumos iki 40 cm, ledui du smaigai).\n\nMANO SPINTA:\n${gearSummary()}\n\nŽURNALAS:\n${tripsSummary()}`);break;
  }
});
function confirm_(msg,btn){if(btn.dataset.sure==='1')return true;btn.dataset.sure='1';btn.textContent='Paspausk dar kartą';setTimeout(()=>{btn.dataset.sure='';},3000);return false}

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#stage').hidden)closeStage()});
document.addEventListener('input',e=>{
  const el=e.target;const val=el.type==='checkbox'?el.checked:el.value;
  if(el.id==='gq'){S.q=el.value;const list=S.gear.filter(g=>(S.cat==='all'||g.cat===S.cat)&&(!S.q||JSON.stringify(g).toLowerCase().includes(S.q.toLowerCase())));$('#gearList').innerHTML=gearListHTML(list);return}
  if(el.dataset.p){S.plan[el.dataset.p]=val;return}
  if(!M)return;
  if(el.dataset.g){const[i,f]=el.dataset.g.split('.');M.data[+i][f]=val;if(el.dataset.recat)renderBatch();return}
  if(el.dataset.t){setPath(M.data,el.dataset.t,val);if(el.dataset.t==='date'&&val){const m=moon(val);$('#moonL').textContent='· mėnulis: '+m.name+', '+m.ill+'%'}return}
  if(el.dataset.c){const[i,f]=el.dataset.c.split('.');M.data.catches[+i][f]=val;return}
  if(el.dataset.w){setPath(M.data,el.dataset.w,val);if(el.dataset.w.startsWith('legal.')||el.dataset.w==='kind'||el.dataset.w==='name'){const x=$('#wLegal');if(x)x.innerHTML=legalHTML(legal(M.data,'Spiningas iš kranto',today(),['Lydeka','Starkis']))}}
});
$('#file').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  try{const items=await recognize(files);toast(items.length?'Atpažinta: '+items.length+'. Patikrink ir išsaugok.':'Nieko neatpažinau, įvesk ranka.');
    if(pendingFiles==='add'&&M&&M.kind==='gear')M.data.push(...items);else M={kind:'gear',data:items.length?items:[newGear()]};renderBatch()}
  catch(err){toast(err.message||String(err),6000)}
});
$('#cfile').addEventListener('change',async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  try{
    if(M&&M.kind==='trip'){await addCatchPhotos(files);return}
    if(S.activeTrip){const keep=M;M={kind:'trip',data:JSON.parse(JSON.stringify(S.activeTrip))};
      await addCatchPhotos(files);const r=await save('trips',M.data);M=keep;if(r&&!db){renderMain()}}
  }catch(err){toast(err.message||String(err),6000)}
});
/* aprašymas -> sąlygos */
async function tripFromText(btn){
  const txt=($('#freeText')||{}).value||'';if(txt.trim().length<5){toast('Parašyk ar padiktuok, kokios buvo sąlygos');return}
  btn.disabled=true;btn.textContent='Skaitau…';
  try{
    const t=await ai(`Iš žvejo aprašymo ištrauk žvejybos sąlygas. Grąžink TIK JSON objektą, be teksto. Nespėliok: ko neminėta, palik "". Šiandien ${today()}. Laikus rašyk 24 val. formatu HH:MM.
Schema: {"date":"YYYY-MM-DD","start":"","end":"","waterName":"","type":"${TRIPTYPES.join('|')}","recent":"daug|mažai|nežinau|","w":{"temp":"","pressure":"","wind":"","dir":"${DIRS.filter(Boolean).join('|')}","sky":"${SKY.filter(Boolean).join('|')}","wtemp":"","clarity":"Skaidrus|Šiek tiek drumstas|Drumstas","ice":""},"notes":""}
Vandenys: ${S.waters.map(w=>w.name).join(', ')||'(nėra)'}
Aprašymas: """${txt}"""`);
    const o=parseJSON(t);const T=M.data;
    ['date','start','end','waterName','type','recent','notes'].forEach(k=>{if(o[k])T[k]=String(o[k])});
    Object.entries(o.w||{}).forEach(([k,v])=>{if(v!==''&&v!=null)T.w[k]=String(v)});
    $('#tripBody').innerHTML=tripBody();toast('Užpildyta. Patikrink laukus ir išsaugok.');
  }catch(err){toast(err.message||String(err),6000);btn.disabled=false;btn.textContent='Užpildyti sąlygas iš aprašymo'}
}

/* dictation */
let dict=null;
async function initMic(){try{dict=await (window.claude&&claude.use?claude.use('dictation'):null)}catch(e){dict=null}
  if(dict&&M&&M.kind==='trip'){M.mic=true;const tb=$('#tripBody');if(tb){const ft=$('#freeText')?.value;tb.innerHTML=tripBody();if($('#freeText'))$('#freeText').value=ft||''}}}
function toggleMic(b){
  if(!dict)return;
  if(b.dataset.on==='1'){dict.stop();return}
  const ta=$('#freeText');let base=ta.value?ta.value+' ':'';
  dict.onPartial(({text})=>{ta.value=base+text});
  dict.onFinal(({text})=>{base+=text+' ';ta.value=base});
  dict.onState(({state})=>{b.dataset.on=state==='listening'?'1':'';b.textContent=state==='listening'?'Sustabdyti':'Diktuoti'});
  dict.start().catch(()=>toast('Mikrofono leidimas nesuteiktas, rašyk ranka.'));
}

/* ---------- boot ---------- */
renderAll();
initDb();
setInterval(()=>{const el=$('#elapsed');if(el&&S.activeTrip)el.textContent=elapsedStr(S.activeTrip)},20000);
